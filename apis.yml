- aid: aeb:aeb-customs-management-api
  name: AEB Customs Management API
  description: Electronic customs declaration filing for import, export and transit. Creates consignments
    and deliveries, transmits them to national customs systems (German ATLAS, EU AES/NCTS, UK CHIEF),
    and polls declarations, statuses, MRNs, documents and attachments back. Also exposes Intrastat, EMCS
    and tariff/fee calculation operations.
  humanURL: https://customsmanagement.docs.developers.aeb.com/
  baseURL: https://rz3.aeb.de/test2ici/rest
  tags:
  - Customs
  - Trade Compliance
  - Customs Declaration
  - ATLAS
  - NCTS
  - AES
  - Intrastat
  properties:
