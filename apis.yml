aid: aeb
url: https://raw.githubusercontent.com/api-evangelist/aeb/refs/heads/main/apis.yml
name: AEB
kind: company
description: 'AEB SE is a German supply chain and global trade software company, headquartered in Stuttgart
  and 100% employee-owned, whose platform is used by 7,300+ companies for customs filing, trade compliance,
  multi-carrier shipping, transport and freight cost management, and warehouse management. In the logistics
  chain AEB sits at the intermediation layer of customs and trade tech: it is the certified filer between
  the shipper or forwarder and the customs authority (German ATLAS, EU AES/NCTS/ICS, EMCS, Intrastat,
  UK CHIEF), and the multi-carrier abstraction between the shipper and 300+ carriers, generating the carrier
  EDI so the customer never has to. Its API posture is unusually open for this tier: four public ReadMe
  developer hubs (Customs, Trade Compliance, Transport & Freight Management, SAP add-ons) publish machine-readable
  OpenAPI 3.0.1 for every product, served live and unauthenticated from AEB''s own test and demo instances,
  with shared try-it credentials in the docs. But the contract is entirely proprietary — a REST-over-RPC
  business-facade shape unique to AEB, with a legacy SOAP business facade still exposed beside it — and
  production access requires registering with AEB and licensing the products, so it is a documented, quotable,
  contract-gated API rather than a self-serve one.'
