openapi: 3.2.0
info:
  title: Carrier Connect HTTP Carrier Definition API
  description: Thank you for using our HTTP API documentation.
  version: '3.0'
servers:
- url: https://rz3.aeb.de/demo1cai/rest
security:
- SWAGGER_AUTH_KEY: []
- BASIC_AUTH: []
tags:
- name: CarrierDefinition
  description: Rest API for carrier definitions
paths:
  /carrier-definitions/{id}:
    get:
      tags:
      - CarrierDefinition
      description: 'Returns a carrier definition with the requested ID. If the ID does not exist, an error will be returned '
      operationId: getCarrierDefinition
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierDefinition'
              examples:
                Carrier definition entry:
                  description: Carrier definition entry
                  value:
                    identCode: UPS
                    carrierType: STANDARD
                    name: UPS
                    translations:
                    - language: EN
                    - language: DE
                    extendedInfo:
                      carrierUrl: https://www.ups.com/
        '404':
          description: Carrier definition with the requested ID is not found.
          content:
            application/json:
              examples:
                Carrier definition not found:
                  description: Carrier definition not found
                  value:
                    errorMessage: Keine Dienstleister-Definition mit der ID 'BASS' gefunden.
  /carrier-definitions:
    get:
      tags:
      - CarrierDefinition
      description: Returns all carrier definitions matching the given filter criteria. In case no carrier definition matches the given filter criteria an empty carrier definition collection is returned. All filter fields are case insensitive. If the filter field supports place holders ('*' or '%'), you get all carrier definitions back beginning with the value of the filter. Means a place holder at the end of the filter value is added automatically.
      operationId: searchCarrierDefinitions
      parameters:
      - name: is_disabled
        in: query
        description: If this filter is set to 'true', only carrier definitions which are disabled will be returned.
        schema:
          type: boolean
          default: false
        example: false
      - name: ident_code_like
        in: query
        description: Filters carrier defintions by identCode. In the example, all carrier definitions are returned whose identCode contains the segment 'ups'. This filter field is case insensitive and placeholders are supported.
        schema:
          type: string
        example: '*ups*'
      - name: name_like
        in: query
        description: Filters carrier defintions by name. In the example, all carrier definitions are returned whose name contains the segment 'dpd'. This filter field is case insensitive and placeholders are supported.
        schema:
          type: string
        example: '*dpd*'
      - name: offset
        in: query
        description: 'The starting point from which to return elements of the ordered list.<br><i>Minimum : 0</i>'
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
        example: 0
      - name: limit
        in: query
        description: 'The maximum number of elements to be returned from the ordered list.<br><i>Minimum : 1</i><br><i>Maximum : 1000</i>'
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 1000
        example: 200
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierDefinitionPage'
              examples:
                Carrier definition list:
                  description: Carrier definition list
                  value:
                    totalElements: 26
                    content:
                    - identCode: DHLEUROPAKET
                      carrierType: STANDARD
                      name: DHL Europaket
                      translations:
                      - language: DE
                      - language: EN
                      extendedInfo:
                        carrierUrl: https://www.dhl.de/de/geschaeftskunden/paket/leistungen-und-services/internationaler-versand/europaket.html
                    - identCode: DHLEXINT_NL
                      carrierType: STANDARD
                      name: DHL Express Netherlands
                      translations:
                      - language: DE
                      - language: EN
                      extendedInfo:
                        carrierUrl: https://www.dhl.nl/nl/express.html
  /carrier-definitions/{id}/additional-values:
    get:
      tags:
      - CarrierDefinition
      description: 'Returns a list of all the additional values of a carrier definition with the requested ID. If the ID does not exist, an error will be returned '
      operationId: getAdditionalValueDefinitions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalValueDefinitionDefinitionPage'
              examples:
                Enabled additional value definition list:
                  description: Enabled additional value definition list
                  value:
                    totalElements: 14
                    content:
                    - identCode: UPSINSURCHAR
                      dataType: DECIMAL2
                      businessObject: SHIPMENT
                      translations:
                      - language: DE
                        name: Versicherungskosten
                      - language: EN
                        name: Insurance costs
                    - identCode: UPSINVADDCOMMENT
                      dataType: STRING
                      businessObject: SHIPMENT
                      translations:
                      - language: DE
                        name: Invoice Additional Comments
                      - language: EN
                        name: Invoice Additional Comments
                    - identCode: UPSDISCOUNT
                      dataType: DECIMAL2
                      businessObject: SHIPMENT
                      translations:
                      - language: DE
                        name: Preisnachlass
                      - language: EN
                        name: Discount
                    - identCode: UPSELAUTHCODE
                      dataType: STRING
                      businessObject: SHIPMENT
                      translations:
                      - language: DE
                        name: Sicherheits-Code
                      - language: EN
                        name: Electronic authorization code
                    - identCode: UPSFREICHAR
                      dataType: DECIMAL2
                      businessObject: SHIPMENT
                      translations:
                      - language: DE
                        name: Frachtkosten
                      - language: EN
                        name: Freight costs
                    - identCode: UPSHAZTECHNAMEDE
                      dataType: STRING
                      businessObject: HAZITEM
                      translations:
                      - language: DE
                        name: Technischer Name (Deutsch)
                      - language: EN
                        name: Technical Name (in German)
                    - identCode: UPSADDIEMAIL
                      dataType: STRING
                      businessObject: SHIPMENT
                      translations:
                      - language: DE
                        name: Weitere E-Mail-Adresse
                      - language: EN
                        name: Additional mail address
                    - identCode: UPSAUDITREQ
                      dataType: STRING
                      businessObject: PACKAGE
                      translations:
                      - language: DE
                        name: Audit erforderlich
                      - language: EN
                        name: Audit required
                    - identCode: UPSPCKREF5
                      dataType: STRING
                      businessObject: PACKAGE
                      translations:
                      - language: DE
                        name: Packstückreferenz 5 (FA007)
                      - language: EN
                        name: Package reference 5 (FA007)
                    - identCode: UPSMRN
                      dataType: STRING
                      businessObject: SHIPMENT
                      translations:
                      - language: DE
                        name: MRN
                      - language: EN
                        name: MRN
                    - identCode: UPSOTHERCHAR
                      dataType: DECIMAL2
                      businessObject: SHIPMENT
                      translations:
                      - language: DE
                        name: Andere Kosten
                      - language: EN
                        name: Other costs
                    - identCode: UPSPCKREF3
                      dataType: STRING
                      businessObject: PACKAGE
                      translations:
                      - language: DE
                        name: Packstückreferenz 3 (FA005)
                      - language: EN
                        name: Package reference 3 (FA005)
                    - identCode: UPSPCKREF4
                      dataType: STRING
                      businessObject: PACKAGE
                      translations:
                      - language: DE
                        name: Packstückreferenz 4 (FA006)
                      - language: EN
                        name: Package reference 4 (FA006)
                    - identCode: UPSINVDECLSTATE
                      dataType: STRING
                      businessObject: SHIPMENT
                      translations:
                      - language: DE
                        name: Invoice Declaration Statement
                      - language: EN
                        name: Invoice Declaration Statement
        '404':
          description: Carrier definition with the requested ID is not found.
          content:
            application/json:
              examples:
                Carrier definition not found:
                  description: Carrier definition not found
                  value:
                    errorMessage: Keine Dienstleister-Definition mit der ID 'BASS' gefunden.
  /carrier-definitions/{id}/carrier-info-texts:
    get:
      tags:
      - CarrierDefinition
      description: Returns a list of all the carrier info texts of a carrier definition with the requested ID.
      operationId: getCarrierInfoTextDefinitions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: show_disabled
        in: query
        description: If this filter is set to 'true', carrier info text definitions which are disabled will be returned additionally.
        schema:
          type: boolean
          default: false
        example: false
      responses:
        '200':
          description: Successful call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierInfoTextDefinitionPage'
              examples:
                Enabled carrier info text definition list:
                  description: Enabled carrier info text definition list
                  value:
                    totalElements: 5
                    content:
                    - identCode: TSR
                      carrierInfoTextType: GENERAL
                      carrierInfoTextParamHandling: STRUCTURED_DATA_OPTIONAL
                      carrierInfoTextStructuredData: SHIP_OR_PICK_ADDR_CONTACT_PHONE
                      maxTextLength: 10
                      translations:
                      - language: EN
                        description: 'Handling instruction:'
                      - language: DE
                        description: 'Transportanweisung:'
                    - identCode: TEST
                      carrierInfoTextType: GENERAL
                      translations:
                      - language: DE
                        description: Test Hinweistext
                      - language: EN
                        description: Test carrier info text
                    - identCode: TEST1
                      carrierInfoTextType: GENERAL
                      translations:
                      - language: DE
                        description: Test Hinweistext 1
                      - language: EN
                        description: Test carrier info text 1
                    - identCode: HID
                      carrierInfoTextType: GENERAL
                      translations:
                      - language: EN
                        description: 'Handling instructions (LTL/FTL) delivery:'
                      - language: DE
                        description: 'Transportanweisung (LTL/FTL) Zustellung:'
        '404':
          description: Carrier definition with the requested ID is not found.
          content:
            application/json:
              examples:
                Carrier definition not found:
                  description: Carrier definition not found
                  value:
                    errorMessage: Keine Dienstleister-Definition mit der ID 'BASS' gefunden.
  /carrier-definitions/{id}/despatch-countries:
    get:
      tags:
      - CarrierDefinition
      description: 'Returns a list of all the despatch countries of a carrier definition with the requested ID. If the ID does not exist, an error will be returned '
      operationId: getCarrierDespatchCountries
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierDespatchCountryPage'
              examples:
                Despatch country list:
                  description: Despatch country list
                  value:
                    totalElements: 1
                    content:
                    - isoCode: DE
                      name: Deutschland
        '404':
          description: Carrier definition with the requested ID is not found.
          content:
            application/json:
              examples:
                Carrier definition not found:
                  description: Carrier definition not found
                  value:
                    errorMessage: Keine Dienstleister-Definition mit der ID 'BASS' gefunden.
  /carrier-definitions/{id}/logos:
    get:
      tags:
      - CarrierDefinition
      description: 'Returns the logos of a carrier with the requested ID. If the ID does not exist, an error will be returned '
      operationId: getCarrierDefinitionLogos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierDefinitionLogos'
              examples:
                Base64 encoded logo list:
                  description: Base64 encoded logo list
                  value:
                    logo: 
                    smallLogo: 
                    webLogo: 
                Empty list:
                  description: Empty list
                  value:
                    logo: ''
                    smallLogo: ''
                    webLogo: ''
        '404':
          description: Carrier definition with the requested ID is not found.
          content:
            application/json:
              examples:
                Carrier definition not found:
                  description: Carrier definition not found
                  value:
                    errorMessage: Keine Dienstleister-Definition mit der ID 'BASS' gefunden.
  /carrier-definitions/{id}/services:
    get:
      tags:
      - CarrierDefinition
      description: 'Returns a list of all the services of a carrier definition with the requested ID. If the ID does not exist, an error will be returned '
      operationId: getServiceDefinitions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: show_disabled
        in: query
        description: If this filter is set to 'true', service definitions which are disabled will be returned additionally.
        schema:
          type: boolean
          default: false
        example: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDefinitionPage'
              examples:
                Enabled service definition list:
                  description: Enabled service definition list
                  value:
                    totalElements: 13
                    content:
                    - identCode: HERMESDE_STD
                      isDocumentService: false
                      isDomesticAllowed: true
                      isFixedDateService: false
                      isGoodsService: true
                      isInternationalAllowed: true
                      isPackageOriented: true
                      note: 'Transportversicherung: bis 500 EUR/Sendung inklusive'
                      translations:
                      - language: EN
                        name: Hermes standard parcel
                        description: Domestic and international goods dispatch
                      - language: DE
                        name: Hermes Standard Paket
                        description: Nationaler und internationaler Warenversand
                    - identCode: HERMESDE_EXPR
                      isDocumentService: false
                      isDomesticAllowed: true
                      isFixedDateService: false
                      isGoodsService: true
                      isInternationalAllowed: false
                      isPackageOriented: true
                      translations:
                      - language: EN
                        name: Express service
                        description: Domestic goods dispatch
                      - language: DE
                        name: EilService
                        description: Nationaler Warenversand
                    - identCode: HERMESDE_DELDATE
                      isDocumentService: false
                      isDomesticAllowed: true
                      isFixedDateService: true
                      isGoodsService: true
                      isInternationalAllowed: false
                      isPackageOriented: true
                      translations:
                      - language: EN
                        name: Delivery day
                        description: Domestic goods dispatch
                      - language: DE
                        name: WunschTag
                        description: Nationaler Warenversand
        '404':
          description: Carrier definition with the requested ID is not found.
          content:
            application/json:
              examples:
                Carrier definition not found:
                  description: Carrier definition not found
                  value:
                    errorMessage: Keine Dienstleister-Definition mit der ID 'BASS' gefunden.
  /carrier-definitions/{id}/value-added-services:
    get:
      tags:
      - CarrierDefinition
      description: 'Returns a list of all the value added services of a carrier definition with the requested ID. If the ID does not exist, an error will be returned '
      operationId: getValueAddedServiceDefinitions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: show_disabled
        in: query
        description: If this filter is set to 'true', value added service definitions which are disabled will be returned additionally.
        schema:
          type: boolean
          default: false
        example: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueAddedServiceDefinitionPage'
              examples:
                Enabled value added service definition list:
                  description: Enabled value added service definition list
                  value:
                    totalElements: 8
                    content:
                    - identCode: NACHNAHME_L_SCHECK
                      valueAddedServiceType: COD
                      translations:
                      - language: DE
                        name: 'Nachnahme: landesüblicher Scheck'
                        description: 'Nachnahme: landesüblicher Scheck'
                      - language: EN
                        name: 'Cash on delivery: standard local check'
                        description: 'Cash on delivery: standard local check'
                    - identCode: HEBEBUEHNE
                      valueAddedServiceType: NONE
                      translations:
                      - language: EN
                        name: Hydraulic ramp delivery
                        description: Hydraulic ramp delivery
                      - language: DE
                        name: Hebebühne Zustellung
                        description: Hebebühne Zustellung
                    - identCode: SELBSTABHOLER
                      valueAddedServiceType: NONE
                      translations:
                      - language: EN
                        name: Self pickup
                        description: Self pickup
                      - language: DE
                        name: Selbstabholer
                        description: Selbstabholer
                    - identCode: PICKUPBOOKING
                      valueAddedServiceType: COLL_BOOK
                      translations:
                      - language: DE
                        name: Abholungsbeauftragung
                        description: Abholungsbeauftragung
                      - language: EN
                        name: Collection booking
                        description: Collection booking
                    - identCode: HEBEBUEHNE_COLLECT
                      valueAddedServiceType: NONE
                      translations:
                      - language: EN
                        name: Hydraulic ramp collection
                        description: Hydraulic ramp collection
                      - language: DE
                        name: Hebebühne Abholung
                        description: Hebebühne Abholung
                    - identCode: NACHNAHME_BAR
                      valueAddedServiceType: COD
                      translations:
                      - language: EN
                        name: 'Cash on delivery: cash'
                        description: 'Cash on delivery: cash'
                      - language: DE
                        name: 'Nachnahme: Bar'
                        description: 'Nachnahme: Bar'
                    - identCode: DOCUMENTUPLOAD
                      valueAddedServiceType: UPL_DOCS
                      translations:
                      - language: EN
                        name: Digital Documents
                        description: With Digital Documents by Dachser it is possible to transmit electronic files.
                      - language: DE
                        name: Digitale Dokumente
                        description: Mit Digitale Dokumente von Dachser können Sie Dokumente an Dachser elektronisch übermitteln.
                    - identCode: NACHNAHME_B_SCHECK
                      valueAddedServiceType: COD
                      translations:
                      - language: EN
                        name: 'Cash on delivery: confirmed check'
                        description: 'Cash on delivery: confirmed check'
                      - language: DE
                        name: 'Nachnahme: bankbestätigter Scheck'
                        description: 'Nachnahme: bankbestätigter Scheck'
        '404':
          description: Carrier definition with the requested ID is not found.
          content:
            application/json:
              examples:
                Carrier definition not found:
                  description: Carrier definition not found
                  value:
                    errorMessage: Keine Dienstleister-Definition mit der ID 'BASS' gefunden.
components:
  schemas:
    ServiceDefinitionPage:
      required:
      - content
      - totalElements
      type: object
      properties:
        totalElements:
          type: integer
          description: The total number of elements available to return.
          readOnly: true
          example: 100
        content:
          type: array
          description: List of service definitions.
          items:
            $ref: '#/components/schemas/ServiceDefinition'
    CarrierDefinitionPage:
      required:
      - content
      - totalElements
      type: object
      properties:
        totalElements:
          type: integer
          description: The total number of elements available to return.
          readOnly: true
          example: 100
        content:
          type: array
          description: List of carrier definitions.
          items:
            $ref: '#/components/schemas/CarrierDefinition'
    CarrierInfoTextDefinitionPage:
      required:
      - content
      - totalElements
      type: object
      properties:
        totalElements:
          type: integer
          description: The total number of elements available to return.
          readOnly: true
          example: 100
        content:
          type: array
          description: List of carrier info text definitions.
          items:
            $ref: '#/components/schemas/CarrierInfoTextDefinition'
    AdditionalValueDefinitionTextTranslation:
      required:
      - language
      type: object
      properties:
        language:
          maxLength: 2
          minLength: 2
          pattern: '[A-Z]{2}'
          type: string
          description: 2-letter ISO code of the language.
          example: DE
        name:
          maxLength: 40
          minLength: 0
          type: string
          description: The name of the additional value.
      description: Name of the additional value in a certain language.
    ValueAddedServiceDefinitionPage:
      required:
      - content
      - totalElements
      type: object
      properties:
        totalElements:
          type: integer
          description: The total number of elements available to return.
          readOnly: true
          example: 100
        content:
          type: array
          description: List of value added service definitions.
          items:
            $ref: '#/components/schemas/ValueAddedServiceDefinition'
    AdditionalValueDefinitionDefinitionPage:
      required:
      - content
      - totalElements
      type: object
      properties:
        totalElements:
          type: integer
          description: The total number of elements available to return.
          readOnly: true
          example: 100
        content:
          type: array
          description: List of additional value definitions.
          items:
            $ref: '#/components/schemas/AdditionalValueDefinition'
    CarrierExtendedInfo:
      type: object
      properties:
        carrierUrl:
          maxLength: 150
          minLength: 0
          type: string
          description: The URL of the carrier from the carrier website.
        imprint:
          maxLength: 250
          minLength: 0
          type: string
          description: The official name of the carrier.
      description: Extended information of the carrier.
    ServiceDefinitionTextTranslation:
      required:
      - language
      type: object
      properties:
        language:
          maxLength: 2
          minLength: 2
          pattern: '[A-Z]{2}'
          type: string
          description: 2-letter ISO code of the language.
          example: DE
        name:
          maxLength: 250
          minLength: 0
          type: string
          description: The name of the service.
        description:
          maxLength: 250
          minLength: 0
          type: string
          description: The description of the service.
      description: Name and description of the service in a certain language.
    ValueAddedServiceDefinitionTextTranslation:
      required:
      - language
      type: object
      properties:
        language:
          maxLength: 2
          minLength: 2
          pattern: '[A-Z]{2}'
          type: string
          description: 2-letter ISO code of the language.
          example: DE
        name:
          maxLength: 250
          minLength: 0
          type: string
          description: The name of the value added service.
        description:
          maxLength: 250
          minLength: 0
          type: string
          description: The description of the value added service.
      description: Name and description of the value added service in a certain language.
    CarrierInfoTextDefinition:
      required:
      - carrierInfoTextParamHandling
      - carrierInfoTextType
      - identCode
      - translations
      type: object
      properties:
        identCode:
          maxLength: 20
          minLength: 1
          type: string
          description: The identCode of the MO.
        carrierInfoTextType:
          type: string
          description: The type of the carrier info text.
          enum:
          - TYPE_DG_INFO_LITHIUM_BATTERY
          - TYPE_DELIVERY_INSTRUCTION
          - TYPE_FREE_TEXT
          - TYPE_GENERAL
        carrierInfoTextParamHandling:
          type: string
          description: The parameter handling type of the carrier info text.
          enum:
          - PARAMETER_NOT_REQUIRED
          - PARAMETER_REQUIRED
          - STRUCTURED_DATA_OPTIONAL
        carrierInfoTextStructuredData:
          type: string
          description: The structured data definition of the carrier info text, if applicable.
          enum:
          - CONSIGNEE_CONTACT_PHONE_OR_EMAIL
          - CONSIGNEE_CONTACT_EMAIL
          - CONSIGNEE_CONTACT_PHONE
          - IMPORTER_ADDRESS
          - PAYER_OF_CHARG_ACC_NO
          - PICKUPADDR_CONTACT_PHONE
          - PORT_OF_DISCHARGE_CODE
          - SHIPPER_EORI_NO
          - SHIP_OR_PICK_ADDR_CONTACT_PHONE
          - UNDEFINED
          - CUSTOM_REGISTRATION_NO
          - DELIVERY_INSTRUCTION
          - DELIVERY_NOTE_NUMBER_SHIP
          - END_CUSTOMER_REFERENCE
          - GENERAL_INSTRUCTION
          - INVOICE_NUMBER
          - PICKUP_INSTRUCTION
          - PURCHASE_ORDER_NUMBER_SHIP
          - RECEIVER_EORI_NUMBER
          - REFERENCENUMBER1
        maxTextLength:
          type: integer
          description: The maximum text length of the carrier info text, if applicable.
          format: int32
        translations:
          type: array
          description: The description of the carrier info text in multiple languages.
          items:
            $ref: '#/components/schemas/CarrierInfoTextDefinitionTextTranslation'
      description: Information about the additional info text the carrier offers.
    CarrierDefinitionTextTranslation:
      required:
      - language
      type: object
      properties:
        language:
          maxLength: 2
          minLength: 2
          pattern: '[A-Z]{2}'
          type: string
          description: 2-letter ISO code of the language.
          example: DE
        description:
          maxLength: 250
          minLength: 0
          type: string
          description: Name of the carrier.
      description: Name of the carrier in a certain language.
    CarrierDefinition:
      required:
      - carrierType
      - identCode
      - name
      - translations
      type: object
      properties:
        identCode:
          maxLength: 20
          minLength: 1
          type: string
          description: The identCode of the MO.
        carrierType:
          type: string
          description: '<p>The carrier type assigns the carrier to a category that defines the support and  maintenance level. Possible values: <li> STANDARD the carrier is part of the standard portfolio. It is regularly maintained, supported and kept up to date. <li> PROJECT the carrier is only used by very few customers and thus is not part of the standard portfolio. <li> CLIENT the carrier is defined for a specific client only and thus is not part of the standard portfolio. </p> <br> PROJECT and CLIENT carrier are not maintained by default and may become outdated over time. Maintenance must be explicitly ordered.'
          enum:
          - STANDARD
          - PROJECT
          - CLIENT
        name:
          maxLength: 50
          minLength: 1
          type: string
          description: The name of the requested carrier.
        translations:
          type: array
          description: The name of the carrier in multiple languages.
          items:
            $ref: '#/components/schemas/CarrierDefinitionTextTranslation'
        extendedInfo:
          $ref: '#/components/schemas/CarrierExtendedInfo'
      description: The most important information of the carrier definition.
    ServiceDefinition:
      required:
      - identCode
      type: object
      properties:
        identCode:
          maxLength: 20
          minLength: 1
          type: string
          description: The identCode of the MO.
        isDocumentService:
          type: boolean
          description: Returns true when service is used for the transport of documents.
        isDomesticAllowed:
          type: boolean
          description: Returns true when service is available for domestic transports.
        isFixedDateService:
          type: boolean
          description: Returns true when service allows a fixed date delivery.
        isGoodsService:
          type: boolean
          description: Returns true when service is used for the transport of goods.
        isInternationalAllowed:
          type: boolean
          description: Returns true when service is available for international transports.
        isPackageOriented:
          type: boolean
          description: Returns true when service is package oriented.
        note:
          type: string
          description: Comments for the service.
        translations:
          type: array
          description: The name and description of the service in multiple languages.
          items:
            $ref: '#/components/schemas/ServiceDefinitionTextTranslation'
      description: Information about the service the carrier offers.
    CarrierDespatchCountryPage:
      required:
      - content
      - totalElements
      type: object
      properties:
        totalElements:
          type: integer
          description: The total number of elements available to return.
          readOnly: true
          example: 100
        content:
          type: array
          description: List of all the despatch countries of the carrier. If the carrier operates globally, this list contains all countries.
          items:
            $ref: '#/components/schemas/CarrierDespatchCountry'
    AdditionalValueDefinition:
      required:
      - businessObject
      - dataType
      - identCode
      - translations
      type: object
      properties:
        identCode:
          maxLength: 20
          minLength: 1
          type: string
          description: The identCode of the MO.
        dataType:
          type: string
          description: The data type of the additional value.
          enum:
          - BOOLEAN
          - CHOICE
          - CURRENCY
          - DATE
          - DATETIME
          - DECIMAL2
          - DECIMAL3
          - PACKAGE_TYPE
          - STRING
          - TIME
        businessObject:
          type: string
          description: The business object, which the additional value refers to.
          enum:
          - HAZITEM
          - ITEM
          - PACKAGE
          - SHIPMENT
        translations:
          type: array
          description: The name of the additional value in multiple languages.
          items:
            $ref: '#/components/schemas/AdditionalValueDefinitionTextTranslation'
      description: Information about the additional value the carrier offers.
    CarrierInfoTextDefinitionTextTranslation:
      required:
      - language
      type: object
      properties:
        language:
          maxLength: 2
          minLength: 2
          pattern: '[A-Z]{2}'
          type: string
          description: 2-letter ISO code of the language.
          example: DE
        description:
          maxLength: 250
          minLength: 0
          type: string
          description: The description of the carrier info text.
      description: Description of the carrier info text in a certain language.
    CarrierDespatchCountry:
      type: object
      properties:
        isoCode:
          maxLength: 2
          minLength: 2
          pattern: '[A-Z]{2}'
          type: string
          description: The isoCode of the country.
        name:
          maxLength: 50
          minLength: 0
          type: string
          description: The name of the country.
      description: Information about the supported despatch country of the carrier.
    ValueAddedServiceDefinition:
      required:
      - identCode
      - translations
      - valueAddedServiceType
      type: object
      properties:
        identCode:
          maxLength: 20
          minLength: 1
          type: string
          description: The identCode of the MO.
        valueAddedServiceType:
          type: string
          description: The type of the value added service.
          enum:
          - ADD_INS
          - BULK_CHILD
          - BULK_MASTER
          - COD
          - COLL_BOOK
          - DEL_CONF
          - IRR_PICKUP
          - MINIMUM_VALIDATION
          - NONE
          - NOTIFY
          - PALLET_EXCHANGE
          - REQ_DELDATE
          - RETURN_ENCL
          - RETURN_ENCL_ADV
          - RETURN_DEMAND
          - SAT_DEL
          - UPL_DOCS
        translations:
          type: array
          description: The name and the description of the value added service in multiple languages.
          items:
            $ref: '#/components/schemas/ValueAddedServiceDefinitionTextTranslation'
      description: Information about the value added service the carrier offers.
    CarrierDefinitionLogos:
      type: object
      properties:
        logo:
          type: string
          description: The logo of the requested carrier.
          format: byte
        smallLogo:
          type: string
          description: The small logo of the requested carrier.
          format: byte
        webLogo:
          type: string
          description: The web logo of the requested carrier.
          format: byte
      description: The logos of the carrier.
  securitySchemes:
    SWAGGER_AUTH_KEY:
      type: apiKey
      name: X-XNSG_WEB_TOKEN
      in: header
    BASIC_AUTH:
      type: http
      scheme: basic
x-proxy-enabled: false
