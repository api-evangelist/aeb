      - searchString
      type: object
      properties:
        identificationDTO:
          $ref: '#/components/schemas/LISRequestIdentification20DTO'
        searchString:
          type: string
          description: The string (e.g. a reference number) to search with.
        ageInDays:
          type: integer
          description: Only tracking objects not older than the value in this field are searched. The maximum value is 50.
          format: int32
        resultTrackingObjectType:
          type: string
          description: 'If filled, the results of different tracking object types will be converted to the type specified.<br> When left empty, all the different tracking objects will be returned unconverted.

            Possible values (if not empty) are: `ORDER`, `CONS`

            Example: if the quick search finds a transport and the result type is `CONS`, the consignment this transport belongs to will be returned. If the consignment can not be determined, the result will be empty.

            The search is dependent on the current search settings. Its performance depends on the settings and the searched objects.'
      description: The request parameters for a quick search.
