    LISMessageMetaDataDTO:
      required:
      - messageReferenceNumber
      - receiverClient
      - receiverRole
      - sendDate
      - senderID
      - senderRole
      - updateMode
      type: object
      properties:
        senderID:
          maxLength: 20
          type: string
          description: 'The identification of the message sender. This should be a string that uniquely identifies the system from which the message was sent and is the same for all messages sent from the system.

            >  `length=20`'
        receiverClient:
          type: string
          description: 'The identCode of the client which will get the message.

            > `length=10`'
        receiverRole:
          type: string
          description: 'The role of the receiver of the message in the supply chain.This will affect how the reference numbers (e.g. orderNumber, materialNumber) will be treated when inserting into the database.

            > possible values: `BUYER`, `SUPPLIER` or `FORWARDER`.'
          enum:
          - BUYER
          - SUPPLIER
          - FORWARDER
        senderRole:
          type: string
          description: 'The role of the sender of the message in the supply chain.

            This will affect how fields of existing objects will be updated by allowing overwrite or not.

            > possible values: `BUYER`, `SUPPLIER` or `FORWARDER`.'
          enum:
          - BUYER
          - SUPPLIER
          - FORWARDER
        sendDate:
          $ref: '#/components/schemas/LISDateAndZoneDTO'
        messageReferenceNumber:
          type: string
          description: 'Unique number of the message given by the sender.

            > `length=50`'
        messageType:
          type: string
          description: 'Can be any text. Used to search and filter messages.

            > `length=100`'
        updateMode:
          type: string
          description: There are several possibilities how the content of the message should be inserted into the system. Update the old contents, delete some contents and so forth.
          enum:
          - STANDARD
          - STRUCTURE
          - NOUPDATE
          - DELETE
          default: STANDARD
        idRefScheme:
          type: string
          description: 'The scheme of the ID and reference number calculation. This will affect how the id and reference fields (e.g. `consignmentID`, `orderItemID`) will be calculated from the DTOs.  Depending on the selected calculation scheme different fields in the DTOs will be used to calculate the unique reference numbers of the objects. These fields will become mandatory when needed in the scheme. This field can be left empty, then the calculation scheme `SUPPLIER` will be used.

            > possible values: `BUYER`, `SUPPLIER` or `IDREFFIELDS`.

            > `length=20`'
          enum:
          - DEFAULT
          - BUYER
          - SUPPLIER
          - IDREFFIELDS
          default: DEFAULT
      description: Meta data of a message
