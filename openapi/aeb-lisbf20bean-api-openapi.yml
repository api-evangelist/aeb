          description: ReferenceField, possible values are <ul><li>CONS_NO (Consignment number)</li><li>SHIPPER_REFERENCE (Reference number of the shipper for the forwarder)</li><li>GLOB_TRANS_NO (Global transaction number of a transport leg)</li><li>INTERNAL_ID (Internal database id. Only to be used for internal purposes)</li><li>FORWARDER_REFERENCE (Reference number by which the shipment can be found on the tracking website of the forwarder)</li><li>MASTER_WAYBILL (Waybill number as a unique number for the process within the organisation of the forwarder)</li><li>HOUSE_WAYBILL (Waybill number distributed by forwarder for one consignee, usually not known to the supplier)</li><li>MEANS_OF_TRANSPORT_NO (Registration number of the means of transport)</li><li>GLOB_UNIT_NO (Global transport unit number)</li><li>SUPPLIER_GLN (Global location number of the supplier. Can only be used in combination with other references fields)</li><li>HANDLING_UNIT_NUMBER_FROM (The handling unit number from of a handling unit. Can only be used in combination with other references fields, e.g. CONS_NO)</li><li>DELIVERY_NOTE_NUMBER (Deliverynotenumber of a handling unit)</li><li>SHIPPING_CONTAINER_CODE (Serial shipping container code for a handling unit)</li><li>DATA_SOURCE_ID_HOST (DataSourceIDHost or transacation ID. The Id of the object in the host system)</li><li>TRANSPORT_SEQUENCE_NUMBER (The sequence number of the transport )</li><li>ORDER_NO_BUYER (Order number buyer. Not to be used together with ORDER_NO or ORDER_NO_SUPPLIER)</li><li>ORDER_NO_SUPPLIER (Order number supplier. Not to be used together with ORDER_NO or ORDER_NO_BUYER)</li><li>BUYER_GLN (Global location number of the buyer. Can only be used in combination with other references fields)</li><li>SEQUENCE_NUMBER (Sequence number by which a transport leg can be found in combination with other numbers)</li><li>ORDER_NO (Order number. To be used when the type type of order number is unknown. It might be order number buyer or supplier. If the type of order number is known, use ORDER_NO_BUYER or ORDER_NO_SUPPLIER instead.<br> Not to be used together with ORDER_NO_BUYER or ORDER_NO_SUPPLIER)</li><li>ORDERITEM_NO (Order item number. To be used when the type type of order item number is unknown. It might be order item number buyer or supplier. Only to be used together with ORDER_NO)</li><li>ORDERITEM_NO_BUYER (Order item number buyer.<br>  Only to be used together with ORDER_NO_BUYER)</li><li>ORDERITEM_NO_SUPPLIER (Order item number buyer <br>Only to be used together with ORDER_NO_SUPPLIER)</li><li>HU_SHIPPER_REFERENCE (Handling unit reference number of the shipper for the forwarder)</li><li>HU_MASTER_WAYBILL_NUMBER (Waybill number for a handling unit)</li></ul>It depends on the trackingObjectType which field makes sense.
          enum:
          - CONS_NO
          - SHIPPER_REFERENCE
          - GLOB_TRANS_NO
          - INTERNAL_ID
          - FORWARDER_REFERENCE
          - MASTER_WAYBILL
          - HOUSE_WAYBILL
          - MEANS_OF_TRANSPORT_NO
          - GLOB_UNIT_NO
          - SUPPLIER_GLN
          - HANDLING_UNIT_NUMBER_FROM
          - DELIVERY_NOTE_NUMBER
          - SHIPPING_CONTAINER_CODE
          - DATA_SOURCE_ID_HOST
          - TRANSPORT_SEQUENCE_NUMBER
          - ORDER_NO_BUYER
          - ORDER_NO_SUPPLIER
          - BUYER_GLN
          - SEQUENCE_NUMBER
          - ORDER_NO
          - ORDERITEM_NO
          - ORDERITEM_NO_BUYER
          - ORDERITEM_NO_SUPPLIER
          - HU_SHIPPER_REFERENCE
          - MASTER_WAYBILL
        referenceNumber:
          type: string
          description: ReferenceNumber
      description: DTO for a single reference field with fieldName and the number
