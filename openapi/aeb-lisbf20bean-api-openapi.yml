            > `TRANS_FORWARDER_REFERENCE` (`TransportLeg.forwarderReference`)

            > `TRANS_POD_SIGNATURE_NAME` (`TransportLeg.podSignatureName`)

            > `TRANS_SHIPPER_REFERENCE` (`TransportLeg.shipperReference`)

            > `CONS_FORWARDER_DELIVERY_REFERENCE` (`Consignment.forwarderDelivRef`)> `CONS_FORWARDER_PICKUP_REFERENCE` (`Consignment.forwarderPickupRef`)

            > `CONS_SHIPPER_REFERENCE` (`Consignment.shipperReference`)

            > `TO_FILTER_CRITERIA` (`trackingObject.toFilterCriteria`)

            > It depends on the tracking object type which fieldname makes sense.'
        fieldValue:
          type: string
          description: 'The value of the field to update.

            > `length=depending on the field defined in fieldName`'
      description: Class to hold values for updates of the tracking objects generically with fieldname
