    LISTrackingEventReferenceField20DTO:
      type: object
      properties:
        referenceField:
          type: string
          description: 'ReferenceField can hold one of the constants REF_FIELD-XYZ constants. It depends on the trackingEventType which field makes sense.

            > Valid values:

            > `ORDER_NO`: To be used when the type type of order number is unknown. It might be order number buyer or supplier. If the type of order number is known, use `ORDER_NO_BUYER` or `ORDER_NO_SUPPLIER` instead.<br> Not to be used together with `ORDER_NO_BUYER` or `ORDER_NO_SUPPLIER`.

            > `ORDER_NO_BUYER`: Order number buyer (`ORDER_NO_BUYER`)<br> Not to be used together with `ORDER_NO` or `ORDER_NO_SUPPLIER`.

            > `ORDER_NO_SUPPLIER`: Order number supplier (`ORDER_NO_SUPPLIER`)<br> Not to be used together with `ORDER_NO` or `ORDER_NO_BUYER`.

            > `ORDERITEM_NO`: Order item number (`ORDERITEM_NO`). To be used when the type type of order item number is unknown. It might be order item number buyer or supplier. Only to be used together with `ORDER_NO`.

            > `ORDERITEM_NO_BUYER`: Order item number buyer (`ORDERITEM_NO_BUYER`)<br>  Only to be used together with `ORDER_NO_BUYER`.

            > `ORDERITEM_NO_SUPPLIER`: Order item number buyer (`ORDERITEM_NO_SUPPLIER`)<br>  Only to be used together with `ORDER_NO_SUPPLIER`.

            > `SHIPPER_REFERENCE`: Reference number of the shipper for the forwarder (`SHIPPER_REFERENCE`).

            > `FORWARDER_REFERENCE`: Reference number by which the shipment can be found on the tracking website of the forwarder (`FORWARDER_REFERENCE`).

            > `MASTER_WAYBILL`: Waybill number as a unique number for the process within the organisation of the forwarder (`MASTER_WAYBILL`).

            > `HOUSE_WAYBILL`: Waybill number distributed by forwarder for one consignee, usually not known to the supplier (`HOUSE_WAYBILL`).

            > `MEANS_OF_TRANSPORT_NO`: Registration number of the means of transport (`MEANS_OF_TRANSPORT_NO`).

            > `CONS_NO`: Consignment number (`CONS_NO`).

            > `GLOB_TRANS_NO`: Global transaction number of a transport leg (`GLOB_TRANS_NO`).

            > `SUPPLIER_GLN`: Global location number of the supplier. Can only be used in combination with other references fields.

            > `BUYER_GLN`: Global location number of the buyer. Can only be used in combination with other references fields.

            > `FORWARDER_GLN`: Global location number of the forwarder of a LISHUTransportLeg (`FORWARDER_GLN`).

            > `HU_NUMBER_FROM`: Handling unit number from of a handling unit (`HU_NUMBER_FROM`).

            > `DELIVERY_NOTE_NUMBER`: Deliverynotenumber of a handling unit (`DELIVERY_NOTE_NUMBER`).

            > `GLOBAL_UNIT_NUMBER`: Global unit number of a handling unit (`GLOBAL_UNIT_NUMBER`).

            > `HU_MASTER_WAYBILL_NUMBER`: Waybill number for a handling unit (`HU_MASTER_WAYBILL_NUMBER`).

            > `SHIPPING_CONTAINER_CODE`: Serial shipping container code for a handling unit (`SHIPPING_CONTAINER_CODE`).

            > `HU_SHIPPER_REFERENCE`: Handling unit reference number of the shipper for the forwarder (`HU_SHIPPER_REFERENCE`).

            > `CARRIER_REFERENCE`: Reference number by which a transport leg can be found in the organisation of the carrier (`CARRIER_REFERENCE`).

            > `SEQUENCE_NUMBER`: Sequence number by which a transport leg can be found in combination with other numbers (`SEQUENCE_NUMBER`).

            > `DATA_SOURCE_ID_HOST`: DataSourceIDHost or transacation ID (`DATA_SOURCE_ID_HOST`). The Id of the object in the host system.

            > `INTERNAL_ID`: Internal database id (`INTERNAL_ID`). Only to be used for internal purposes.'
        referenceNumber:
          type: string
          description: 'ReferenceNumber

            > `length=depending on the field defined in referenceField`'
      description: DTO for a single reference field with fieldName and the number
    LISOrderHead20DTO:
