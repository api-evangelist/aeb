          type: integer
          description: The sequence number of the step in a chain of steps. Can be used to sort the steps in the correct order.
          format: int32
        hostCode:
          type: string
          description: The host code of the order fulfillment step. Not always filled. Can be used to map the step to an external object in the system of the caller.
        description:
          type: string
          description: The description of the order fulfillment step.
        status:
          type: string
          description: 'The status of the the step. Possible values: <li> Planned  - The step is planned but there is yet no shipment or other process fulfilling the step <li> Confirmed - There is a shipment or other process fulfilling the step. The process has not yet begun. <li> Started - The process fulfilling the step has begun <li> Finished - The process fulfilling the step has ended'
        events:
          type: array
          description: The events belonging to the step. May be empty dependend on the request.
          items:
            $ref: '#/components/schemas/LISExpTrackingEvent20DTO'
        transportData:
          $ref: '#/components/schemas/LISOFSTransport20DTO'
      description: Abstract DTO as a superclass for classes representing steps in an order fulfillment plan
    LISTrackingEventUpdateField20DTO:
