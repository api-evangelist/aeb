    LISOrderFulfillmentRequest20DTO:
      type: object
      properties:
        clientIdentCode:
          type: string
          description: The identCode of the client owning the order item for the request.
        orderNumber:
          type: string
          description: The order number of the order item whose plan is requested. Can be a sales order or a purchase order number.
        orderItemNumber:
          type: string
          description: The order item number of the order item whose plan is requested Can be a sales order or a purchase order item number.
        partnerGLN:
          type: string
          description: The partner global location number to identify the order item (together with the order/order item number).<br><br> In case of a sales order to be requested the supplier gln should be supplied. <br> In case of a purchase order to be requested the buyer gln should be supplied.
        includeOnlyNotStartedFulfillment:
          type: boolean
          description: Controls the number of plans to be returned. <br><br> When true, only the plan for the partial fulfillment is returned whose execution has not  yet begun.  This is the partial fulfillment that would deliver the remaining quantity of the order item.  If there is no remaining quantity (complete fulfillment begun or finished), no plans will be  returned. <br><br> When false, all plans for all partial fulfillments will be returned.
        ofDataExtent:
          type: string
          description: 'Controls the data extend of the returned plan(s).

            > Possible values:

            > `OFHEAD_ONLY`: only the header data of the plans are returned (LISOrderFulfillmentPlan20DTO)

            > `OFHEAD_WITH_STEPS`: additionally the order fulfillment steps are returned (LISOrderFulfillmentStep20DTO)> `OFHEAD_WITH_STEPS_AND_EVENTS`: additionally the events of the fulfillment steps are returned (LISTrackingEventHead20DTO)

            > If no or an unknown value is given, `OFHEAD_ONLY` is assumed as default value.'
          enum:
          - OFDATAEXTENT_HEAD_ONLY
          - OFHEAD_WITH_STEPS
          - OFHEAD_WITH_STEPS_AND_EVENTS
          default: OFDATAEXTENT_HEAD_ONLY
      description: DTO for order fulfillment plan requests. Version 2.0
