    LISOrderFulfillmentStep20DTO:
      type: object
      properties:
        stepType:
          type: string
          description: The type of the order fulfillment process step.  Momentarily only the value "TRANSPORT" is allowed (may be more in the future).<br><br> There is an associated data field containing the special field values for this type of step. <br> E.g. for transport steps the field "transportData" must be considered.
