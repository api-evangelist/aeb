      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeGetMatchHandlingChangesRequestDTO'
          application/xml:
            schema:
              $ref: '#/components/schemas/AcknowledgeGetMatchHandlingChangesRequestDTO'
      responses:
        '200':
          description: OK. The operation response. See response schema documentation for details.
