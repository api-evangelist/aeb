          example: entity
          enum:
          - company
          - individual
          - bank
          - vessel
          - entity
          - meansOfTransport
          - unknown
        name:
          maxLength: 200
          type: string
          description: Full name of the address, e.g. name of the company (address line 1 - 4) or prename and surname of an individual.<br><em>Depending on the profile settings, this field might be relevant for the address check.</em>
          example: Abu Ahmed Group Inc.
        street:
          maxLength: 100
          type: string
          description: Street of the address, including house number.<br><em>This field is relevant for the address check.</em>
          example: Fuller street 5
        pc:
          maxLength: 40
          type: string
          description: Postal code of the city.<br><em>This field is relevant for the address check.</em>
          example: MK7 6AJ
        city:
          maxLength: 100
          type: string
          description: City of the address.<br><em>This field is relevant for the address check.</em>
          example: Manchester
        district:
          maxLength: 50
          type: string
          description: 'District of the address, resp. line 2 of the city (in German: Ortsteil).'
          example: North
        countryISO:
          maxLength: 2
          type: string
          description: Two character ISO code of the country.<br><em>This field is relevant for the address check.</em>
          example: DE
        telNo:
          maxLength: 40
          type: string
          description: Telephone number.
          example: +4413859-489548
        postbox:
          maxLength: 20
          type: string
          description: The P.O. box of the address.<br><em>Depending on the profile settings, this field might be relevant for the address check.</em>
          example: '12345'
        pcPostbox:
          maxLength: 40
          type: string
          description: The postal code of the P.O. box, if the postal code of the P.O. box differs from the postal code of the street address.
          example: MK7 6AJ
        cityPostbox:
          maxLength: 100
          type: string
          description: The city of the P.O. box, if the city of the P.O. box differs from the city of the street address.
          example: Manchester
        email:
          maxLength: 256
          type: string
          description: Email address.
          example: abu.ahmed@example.com
        fax:
          maxLength: 40
          type: string
          description: Fax number.
          example: +4413859-4895497
        name1:
          maxLength: 50
          type: string
          description: 'Additional information only for companies: The first line of the addresses name.<br><em>Depending on the profile settings, this field might be relevant for the address check.</em>'
          example: Abu Ahmed
        name2:
          maxLength: 50
          type: string
          description: 'Additional information only for companies: The second line of the addresses name.<br><em>Depending on the profile settings, this field might be relevant for the address check.</em>'
          example: Group Inc.
        name3:
          maxLength: 50
          type: string
          description: 'Additional information only for companies: The third line of the addresses name.<br><em>Depending on the profile settings, this field might be relevant for the address check.</em>'
          example: Factory for sweets of all kind
        name4:
          maxLength: 50
          type: string
          description: 'Additional information only for companies: The fourth line of the addresses name.<br><em>Depending on the profile settings, this field might be relevant for the address check.</em>'
          example: Manchester
        title:
          maxLength: 20
          type: string
          description: 'Additional information only for individuals: The title of a person.'
          example: Haji
        surname:
          maxLength: 50
          type: string
          description: 'Additional information only for individuals: The surname of a person.'
          example: Ahmed
        prenames:
          maxLength: 50
          type: string
          description: 'Additional information only for individuals: The prenames of a person.'
          example: Abu
        dateOfBirth:
          maxLength: 20
          type: string
          description: The date of birth in textual representation, e.g. <code>1962-08-20</code> or just <code>1962</code> or other date formats. (Only human-readable.)
          example: '1962'
        passportData:
          maxLength: 200
          type: string
          description: 'Additional information only for individuals: Textual information about the passport, e.g. passport no. and date of issue.'
          example: ID 385948495849
        cityOfBirth:
          maxLength: 50
          type: string
          description: 'Additional information only for individuals: City of birth.'
          example: Dublin
        countryOfBirthISO:
          maxLength: 2
          type: string
          description: 'Additional information only for individuals: Two-letter ISO code for the country of birth.'
          example: IR
        nationalityISO:
          type: string
          description: 'Additional information only for individuals: Two-letter ISO code for the nationality. <br>(max. length: 2)'
          example: IR
        position:
          maxLength: 200
          type: string
          description: 'Additional information only for individuals: Textual information about the position of the individual.'
          example: Senior official of the Islamic State in Iraq and the Levant (ISIL)
        niNumber:
          maxLength: 50
          type: string
          description: Additional identification tokens or numbers of individuals.
          example: Italian fiscal code SSYBLK62T26Z336L
        info:
          maxLength: 1000
          type: string
          description: Summary additional information, e.g. alias names or information composed of other field like position, passportData, dateOfBirth.
          example: UN Ref QDi.401
        aliasGroupNo:
          maxLength: 20
          type: string
          description: Number or name of the group under which all addresses are summarized describing the same person or organization.
          example: '12345'
        free1:
          maxLength: 50
          type: string
          description: Additional field for future use.
          example: free1
        free2:
          maxLength: 50
          type: string
          description: Additional field for future use.
          example: free2
        free3:
          maxLength: 50
          type: string
          description: Additional field for future use.
          example: free3
        free4:
          maxLength: 50
          type: string
          description: Additional field for future use.
          example: free4
        free5:
          maxLength: 50
          type: string
          description: Additional field for future use.
          example: free5
        free6:
          maxLength: 50
          type: string
          description: Additional field for future use.
          example: free6
        free7:
          maxLength: 50
          type: string
          description: Additional field for future use.
          example: free7
        ids:
          type: array
          description: Optional IDs of the address, e.g. like DUNS number or passport number.
          items:
