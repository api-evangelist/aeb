    ClientSystemComplianceEventDTO:
      required:
      - clientIdentCode
      - module
      type: object
      properties:
        level:
          type: string
          description: The severity level of the event to log. Client systems may classify the severity of their events accordingly.
          example: INFO
          enum:
          - INFO
          - WARNING
          - RESTRICTION
          - ERROR
        clientIdentCode:
          maxLength: 10
          type: string
          description: Ident code of the client to create the log entry for. Must be a valid ident code of an existing client.<br>
          example: APITEST
        profileIdentCode:
          maxLength: 20
          type: string
          description: Ident code of the Compliance profile to create the log entry for. If given, must be a valid ident code of a profile valid for the given client. If omitted, the log entry is not linked to a profile.
          example: DEFAULT
        clientSystemId:
          maxLength: 20
          type: string
          description: The unique ID of the host system that creates the log entry. Used to filter log entries by the host system they originate from.
          example: SAP_[sys]_[client]
        organisationUnitHost:
          maxLength: 255
          type: string
          description: Ident code of the organizational unit.
          example: Sales Unit 0711
        referenceId:
          maxLength: 255
          type: string
          description: Reference ID for a host system object or transaction the log entry is linked to. Used to correlate log entries to their source.
          example: CUSNO=4711;CLIENT=800;USER=BEN003;PC=PC-PHILIPP
        referenceComment:
          maxLength: 3000
          type: string
          description: User readable reference comment for a host system object or transaction the log entry is linked to. The user readable version of the reference ID.
          example: 'Customer no.: 4711, Client: 800, User: BEN003, Pc: PC-PHILIPP'
        info:
          maxLength: 60000
          type: string
          description: A textual description of the event.
          example: The compliance lock for order 4711 was removed.
        userIdentification:
          maxLength: 100
          type: string
          description: A description of the user who made the event. Purely informational and does not have to be an existing user in Trade Compliance.
          example: MUELLER
        module:
          type: string
          description: The module the log entry should be created for.
          example: ComplianceScreening
          enum:
          - ComplianceScreening
          - ExportControl
          - LicenseManagement
          - RiskAssessment
        happendAtDate:
          $ref: '#/components/schemas/DateAndZoneDTO'
