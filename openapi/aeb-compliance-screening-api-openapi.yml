          type: string
          description: Reference key for match results and logs, e.g. current user, client, pc, delivery note number or debitor number.<br> This field is for internal technical use to build references between the compliance logs and the client system.
          example: customer.4711.aeb.123
        referenceComment:
          maxLength: 3000
