                $ref: '#/components/schemas/ErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorData'
        '405':
          description: Method not allowed. Use POST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorData'
        '406':
          description: Not Acceptable. This resource produces application/json or application/xml.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorData'
        '415':
          description: Unsupported Media Type. This resource accepts application/json or application/xml.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorData'
        '500':
          description: Internal server error. See errorMessage for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorData'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorData'
components:
  schemas:
    LastRestrictedPartyListUpdateResponseDTO:
      type: object
      properties:
        lastUpdate:
          type: string
          description: 'Last update date of restricted party lists. Format: <code>yyyy-MM-dd HH:mm:ss</code>'
          format: date-time
      description: DTO for wrapping the a "simple" Date result of a function to something, which is JSON-able.
    AddressScreeningResultDTO:
      type: object
      properties:
        matchFound:
          type: boolean
          description: The result of the screening. <code>true</code> if one or more matching restricted party addresses were found, <code>false</code> if not.
          example: true
        wasGoodGuy:
          type: boolean
          description: <code>true</code>, if a Good Guy was defined for this address. Otherwise <code>false</code> is returned.
          example: false
        referenceId:
          maxLength: 255
          type: string
          description: Copied from the corresponding field in the request, allowing to correlate the results to the request.
          example: CUSNO=4711;CLIENT=800;USER=BEN003;PC=PC-PHILIPP
        referenceComment:
          maxLength: 3000
          type: string
          description: Copied from the corresponding field in in the request, allowing to correlate the results to the request.
          example: 'Customer no.: 4711, Client: 800, User: BEN003, Pc: PC-PHILIPP'
      description: Data transfer object for the results of address screening.
    MatchHandlingSyncDTO:
      type: object
      properties:
        clientSystemId:
          maxLength: 20
          type: string
          description: ID of the partner system the match was created by.
          example: API-TEST
        clientReferenceId:
          maxLength: 20
          type: string
          description: Internal reference number that serves for internal identification.
          example: CLIENT=800;USER=BEN003
        typeOfProcessing:
          type: string
          description: 'Represents the accumulated result type of the match result changes.Possible values are: <ul><li><code>''processed''</code></li><li><code>''definedAsGoodGuy''</code></li><li><code>''unprocessed''</code></li></ul>'
          example: processed
        isDeleted:
          type: boolean
          description: Indicates whether the match has already been deleted.<br>This is only relevant for the <code>/ComplianceScreening/matchHandlingChanges</code> call.
          default: false
      description: The sync results of one handled match.
    ProfileDTO:
      type: object
      properties:
        identCode:
          maxLength: 20
          type: string
          description: The internal ident code of the profile.
          example: DEFAULT
        name:
          maxLength: 60
          type: string
          description: The human-readable name of the profile.
          example: Default
      description: Data transfer object for a Compliance profile.
    ScreenAddressesRequestDTO:
      type: object
      properties:
        addresses:
          type: array
          description: The addresses to be screened.
          items:
            $ref: '#/components/schemas/AddressToCheckDTO'
        screeningParameters:
          $ref: '#/components/schemas/AddressScreeningParametersDTO'
      description: Request object for screening addresses against restricted party lists.
    AddressToCheckDTO:
      type: object
      properties:
