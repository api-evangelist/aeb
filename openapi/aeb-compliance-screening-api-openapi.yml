    GetMatchHandlingChangesResponseDTO:
      type: object
      properties:
        hasErrors:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>An error usually means that the request could not be performed.</p><p>Error details are provided in the messages[] array.</p>
          example: false
        hasOnlyRetryableErrors:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>Error details are provided in the messages[] array.</p>
          example: true
        hasWarnings:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>Error details are provided in the messages[] array.</p>
          example: true
        messages:
          type: array
          description: <p>Error or warning messages at the request level.</p><p>There may be additional messages[] arrays at lower data levels as specified in the documentation.</p>
          items:
            $ref: '#/components/schemas/ResponseMessageDTO'
        isComplete:
          type: boolean
          description: <code>true</code>, if the synchronization is complete and currently no further changed match handling results are available. <code>false</code> if not.<br> In this case, after acknowledging with <code>/ComplianceScreening/acknowledgeMatchHandlingChanges</code>, an additional call to <code>/ComplianceScreening/matchHandlingChanges</code> would be needed to get more changes.
          example: true
        syncId:
          type: string
          description: Synchronization ID for acknowledging.<br>Use this syncId in subsequent calls to <code>/ComplianceScreening/acknowledgeMatchHandlingResults</code> to acknowledge the processing of the changed match handling results.<br>This syncId may be <code>null</code> if no changed match handling results were found to synchronize.
          example: '1234'
