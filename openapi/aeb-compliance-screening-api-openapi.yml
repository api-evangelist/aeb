            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgeGetMatchHandlingChangesResponseDTO'
            application/xml:
              schema:
                $ref: '#/components/schemas/AcknowledgeGetMatchHandlingChangesResponseDTO'
        '400':
