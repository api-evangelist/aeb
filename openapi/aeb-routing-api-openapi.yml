        address:
          $ref: '#/components/schemas/RoutingAddressDTO'
        hopRef:
          $ref: '#/components/schemas/HopReferenceDTO'
      description: Class for location based routing task data for BF. Contains data of a complete address or a reference to a hand over point and its location/address in the master data. Either the address or the hopRef is required, the other value must be null.
    RatingProfileDTO:
      required:
