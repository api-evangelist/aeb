  /RoutingBFBean/getRoutingTaskResult:
    servers:
    - url: https://rz3.aeb.de/test2bsm/rest
    post:
      tags:
      - Routing
      summary: getRoutingTaskResult
      description: 'Returns a sorted list of proposals for the provided task id and its current calculation state.<br> <br> The final list of proposals is ranked according to a rating profile. A rating profile uses supplements for score calculation and ranking.<br> <br> Possible states of calculation are:<br> - INPROGRESS: entries (and ordering) might change in future calls. <br> - RANKED: ordering and entries fixed, at least one supplement missing. <br> - COMPLETE: ordering and entries fixed, all supplements are calculated. <br> <br> A new routing task can be created by using createRoutingTask(CreateRoutingTaskRequestDTO).<br>'
      operationId: getRoutingTaskResult
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetRoutingTaskResultRequestDTO'
            examples:
              Basic data:
                description: Basic data
                value:
                  clientSystemId: MY_SYSTEM
                  clientIdentCode: MY_CLIENT
                  userName: MY_USERNAME
                  resultLanguageIsoCodes:
                  - de
                  taskId: MY_ROUTING_TASK_ID
          application/xml:
            schema:
              $ref: '#/components/schemas/GetRoutingTaskResultRequestDTO'
            examples:
              Basic data:
                description: Basic data
                value:
                  clientSystemId: MY_SYSTEM
                  clientIdentCode: MY_CLIENT
                  userName: MY_USERNAME
                  resultLanguageIsoCodes:
                  - de
                  taskId: MY_ROUTING_TASK_ID
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRoutingTaskResultResponseDTO'
            application/xml:
              schema:
                $ref: '#/components/schemas/GetRoutingTaskResultResponseDTO'
      security:
      - BASIC_AUTH: []
  /RoutingBFBean/getSupplementTaskResult:
    servers:
    - url: https://rz3.aeb.de/test2bsm/rest
    post:
      tags:
      - Routing
      summary: getSupplementTaskResult
      description: 'Returns an intermediate result of calculated supplements for the provided task id and its current calculation state.<br> <br> Possible states of calculation are:<br> - INPROGRESS: entries (and ordering) might change in future calls. <br> - COMPLETE: ordering and entries fixed, all supplements are calculated. <br> <br> A new supplement task can be created by using createSupplementTask(CreateSupplementTaskRequestDTO).<br>'
      operationId: getSupplementTaskResult
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetSupplementTaskResultRequestDTO'
            examples:
              Basic data:
                description: Basic data
                value:
                  clientSystemId: MY_SYSTEM
                  clientIdentCode: MY_CLIENT
                  userName: MY_USERNAME
                  resultLanguageIsoCodes:
                  - de
                  taskId: MY_SUPPLEMENT_TASK_ID
          application/xml:
            schema:
              $ref: '#/components/schemas/GetSupplementTaskResultRequestDTO'
            examples:
              Basic data:
                description: Basic data
                value:
                  clientSystemId: MY_SYSTEM
                  clientIdentCode: MY_CLIENT
                  userName: MY_USERNAME
                  resultLanguageIsoCodes:
                  - de
                  taskId: MY_SUPPLEMENT_TASK_ID
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSupplementTaskResultResponseDTO'
            application/xml:
              schema:
                $ref: '#/components/schemas/GetSupplementTaskResultResponseDTO'
      security:
      - BASIC_AUTH: []
  /RoutingBFBean/waitForRoutingTaskResult:
    servers:
    - url: https://rz3.aeb.de/test2bsm/rest
    post:
      tags:
      - Routing
      summary: waitForRoutingTaskResult
      description: 'Waits for the task calculation to finish and returns a sorted list of proposals for the provided task id and its current calculation state.<br> <br> If the calculation takes longer than the set waiting time limit, the list of proposals will be returned in its current unfinished calculation state as soon as the limit is reached.<br> <br> The final list of proposals is ranked according to a rating profile. A rating profile uses supplements for score calculation and ranking.<br><br>Possible states of calculation are:<br>- INPROGRESS: entries (and ordering) might change in future calls. <br>- RANKED: ordering and entries fixed, at least one supplement missing. <br>- COMPLETE: ordering and entries fixed, all supplements are calculated. <br><br>A new routing task can be created by using createRoutingTask(CreateRoutingTaskRequestDTO).<br>'
      operationId: waitForRoutingTaskResult
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitForRoutingTaskResultRequestDTO'
            examples:
              Basic data:
                description: Basic data
                value:
                  clientSystemId: MY_SYSTEM
                  clientIdentCode: MY_CLIENT
                  userName: MY_USERNAME
                  resultLanguageIsoCodes:
                  - de
                  taskId: MY_ROUTING_TASK_ID
                  waitingTimeoutInSeconds: 10
          application/xml:
            schema:
              $ref: '#/components/schemas/WaitForRoutingTaskResultRequestDTO'
            examples:
              Basic data:
                description: Basic data
                value:
                  clientSystemId: MY_SYSTEM
                  clientIdentCode: MY_CLIENT
                  userName: MY_USERNAME
                  resultLanguageIsoCodes:
                  - de
                  taskId: MY_ROUTING_TASK_ID
                  waitingTimeoutInSeconds: 10
      responses:
        default:
          description: default response
          content:
            application/json: {}
            application/xml: {}
      security:
      - BASIC_AUTH: []
components:
  schemas:
    RouteScheduleDTO:
      required:
      - configurationIdentCode
      - state
      type: object
      properties:
        state:
          type: string
          description: 'Calculation state of this schedule. Can have the following values:<br> - PENDING: The routing proposals are still to be calculated. <br> - PROCESSED: Calculation is complete and has valid values<br> - ABORTED: Carrier Select returns an exception.<br> - ERROR: An error was occurred in  the subsequent systems. E.g. Logistics Cost Management.<br> - EXCLUDED: No schedule was calculated as too many service proposals were determined for the request.<br>'
        configurationIdentCode:
          type: string
          description: Identcode of configuration used to calculate this DTO.
        additionalInfo:
          type: array
          description: Additional information about the route schedule. <p> length of the translated text=280 </p>
          items:
            $ref: '#/components/schemas/TextInLanguageDTO'
        earliestShippingDate:
          $ref: '#/components/schemas/DateAndZoneDTO'
        latestShippingDate:
          $ref: '#/components/schemas/DateAndZoneDTO'
        earliestDeliveryDate:
          $ref: '#/components/schemas/DateAndZoneDTO'
        latestDeliveryDate:
          $ref: '#/components/schemas/DateAndZoneDTO'
        internalId:
          type: string
          description: The unique ID of the route schedule. Can be used to uniquely identify the route schedule when requesting the routing task results several times. This is a temporary, unique ID. In very rare cases you may get a different unique ID for the same route schedule and same taskId  (after server restart).
      description: DTO to provide a result of a schedule calculation. It's values are filled depending on the calculation state and the calculation mode.
    BillingAdditionalFreightCalculationDataDTO:
      type: object
      properties:
        modeOfTransportIdentCode:
          type: string
          description: Identifier for the mode of transport. Can be empty, if not needed or if it is not known.
