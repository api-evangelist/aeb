        routeSchedule:
          $ref: '#/components/schemas/RouteScheduleDTO'
      description: Main DTO to hold data on a proposal.<br> Each leg contains information on services enriched with supplements as additional information. The entirety of legs describes one proposal.<br> <br> Individual proposals are comparable by their score and can be ordered by their sortNumber. Score and sortNumber are calculated based on supplements by a rating profile. Two proposals might have the same score but have different sort numbers.
