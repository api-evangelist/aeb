        goodsValue:
          $ref: '#/components/schemas/AmountOfMoneyDTO'
        customsValue:
          $ref: '#/components/schemas/AmountOfMoneyDTO'
        numberOfDeliveryNotes:
          type: integer
          description: represents the number of delivery notes.
          format: int32
        numberOfInvoices:
          type: integer
          description: represents the number of invoices.
          format: int32
        cusBillingFields:
          type: array
          description: Custom fields for Logistics Cost Management.  Every custom field must also be defined in Logistics Cost Management  in a structured type of a Smart-Rules module with the same field name and type.
          items:
            $ref: '#/components/schemas/CusBillingFieldDTO'
      description: The BillingAdditionalFreightCalculationDataDTO provides data to send to Logistics Costs Management. It fills some fields BFreightTransportExtendedDataDTO, but not all. In addition it provides a list of custom fields which must be also customized with the same field name in Logistics Costs Management.
    RoutingTaskLocationDTO:
      type: object
