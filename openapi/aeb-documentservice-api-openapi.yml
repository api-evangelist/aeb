          description: If set, defines the number of documents that will be skipped before collecting results. Use this to retrieve further documents if a previous query did not return all required documents. The number must not exceed 10000
          format: int32
          example: 0
        orderBy:
          type: string
          description: 'Defines how the requested documents are sorted.<ul><li><code>CREATED_AT_ASC</code> : <i>Sorted by date/time of document creation, oldest first.</i></li><li><code>CREATED_AT_DESC</code> : <i>Sorted by date/time of document creation, newest first.</i></li><li><code>REFERENCE_NUMBER_ASC</code> : <i>Sorted by document reference number, alphabetically ascending.</i></li><li><code>REFERENCE_NUMBER_DESC</code> : <i>Sorted by document reference number, alphabetically descending.</i></li><li><code>REFERENCE_TYPE_ASC</code> : <i>Sorted by document reference type, alphabetically ascending.</i></li><li><code>REFERENCE_TYPE_DESC</code> : <i>Sorted by document reference type, alphabetically descending.</i></li></ul>'
          example: CREATED_AT_ASC
          enum:
          - CREATED_AT_ASC
          - CREATED_AT_DESC
          - REFERENCE_NUMBER_ASC
          - REFERENCE_NUMBER_DESC
          - REFERENCE_TYPE_ASC
          - REFERENCE_TYPE_DESC
        documentReferencesInList:
          maxItems: 1000
          type: array
          description: List of document reference criteria (max. 1000 elements allowed). Only documents exactly matching these criteria will be returned.
          items:
            $ref: '#/components/schemas/DocumentReferencesDTO'
    GetPrintRequestStateResponseDataElement:
      required:
      - documentId
      - printRequestId
      type: object
      properties:
        printRequestId:
          type: string
          description: The unique ID of the print request
          example: 0123456789ABCDEFFEDCBA9876543210
        documentId:
          type: string
          description: The unique documentId which defines the document to be printed
          example: 012345678-abcd-4eff-9876-543210fedcba
        stopOnError:
          type: boolean
          description: Indicates a print job as sequential relevant. The following print jobs are not executed as long as the print job is in error state or is not ignored.
          example: false
        isIgnored:
          type: boolean
          description: Indicates that the print request has to be ignored.
          example: false
        state:
          type: string
          description: 'State of the print request (may be `null` if not processed yet). Possible values: PROCESSING, PRINTED, ERROR'
          example: ERROR
          enum:
          - PROCESSING
          - PRINTED
          - ERROR
        stateMessage:
          type: string
          description: State message of the print request. In case of an error state it contains the reason of the error.
          example: There is currently no active Service Agent available. Documents cannot be printed.
        requestedAt:
          type: string
          description: Time at which the print request was created. The format of this value is YYYY-MM-DD'T'HH:MM:SS (in UTC time).
          example: '2024-06-01T12:34:56'
        lastAccessedAt:
          type: string
          description: Time of the last change of the print job. The format of this value is YYYY-MM-DD'T'HH:MM:SS (in UTC time).
          example: '2024-06-01T12:45:00'
        queueStoppedMessage:
          type: string
          description: If the queue is stopped due to an error state of a previous print request it contains the reason of the error. If this message is filled the current print request is not processed till the error is fixed.
          example: There is currently no active Service Agent available. Documents cannot be printed.
        userName:
          type: string
          description: Name of the user who initiated the print request
          example: XYZ
      description: Latest info of the updated print request as returned immediately after update action.
    PrintDocumentInstanceResponseDTO:
      required:
      - printRequestId
      - state
      type: object
      properties:
        hasErrors:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>An error usually means that the request could not be performed.</p><p>Error details are provided in the messages[] array.</p>
          example: false
        hasOnlyRetryableErrors:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>Error details are provided in the messages[] array.</p>
          example: true
        hasWarnings:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>Error details are provided in the messages[] array.</p>
          example: true
        messages:
          type: array
          description: <p>Error or warning messages at the request level.</p><p>There may be additional messages[] arrays at lower data levels as specified in the documentation.</p>
          items:
            $ref: '#/components/schemas/ResponseMessageDTO'
        state:
          type: string
          description: The result state of the document processing
          example: SUCCESS
          enum:
          - SUCCESS
          - DOCUMENT_NOT_FOUND
          - DOCUMENT_LOCKED
          - DOCUMENT_EXPIRED
          - LOCKED
          - DOCUMENT_CONTENT_PENDING
          - PRINTER_NOT_FOUND
        printRequestId:
          type: string
          description: The unique ID of the created print request.
          example: 0123456789ABCDEFFEDCBA9876543210
        effectiveOutputSettings:
          $ref: '#/components/schemas/OutputSettingsPrinterDTO'
        documentInfo:
          $ref: '#/components/schemas/DocumentInfoDTO'
      xml:
        name: PrintDocumentInstanceResponse
    DocumentInstanceInfoDTO:
      required:
      - archivedState
      - createdAt
      - documentId
      - generationState
      - retentionTimestamp
      type: object
      properties:
        documentId:
          type: string
          description: Unique document identifier.
          example: 012345678-abcd-4eff-9876-543210fedcba
        documentReference:
          $ref: '#/components/schemas/DocumentReferenceDTO'
        description:
          type: string
          description: The description of the document.
          example: Invoice for order 4711
        createdAt:
          type: string
          description: Time when the document creation has been requested. The creation time of the actual document contents can be different. The format of this value is yyyy-MM-dd'T'HH:mm:ss (in UTC time).
          example: '2024-06-01T12:34:56'
        createdUserName:
          type: string
          description: User account name who created the document.
          example: XYZ
        generationState:
          type: string
          description: Document content generation/creation state.
          example: OK
          enum:
          - NONE
          - PENDING
          - OK
          - ERROR
        modifiedAt:
          type: string
          description: Time when the document has been modified. The format of this value is yyyy-MM-dd'T'HH:mm:ss (in UTC time).
          example: '2024-06-01T13:00:00'
        modifiedUserName:
          type: string
          description: User account name who modified the document.
          example: XYZ
        sentAt:
          type: string
          description: Time when printing the document has been requested (sent to printer queue). The format of this value is yyyy-MM-dd'T'HH:mm:ss (in UTC time).
          example: '2024-06-01T14:00:00'
        sendUserName:
          type: string
          description: User account name who printed the document.
          example: XYZ
        archivedState:
          type: string
          description: Archiving state.
          example: NONE
          enum:
          - NONE
          - PENDING
          - OK
          - ERROR
        archivedAt:
          type: string
          description: Time when the document contents have been archived. The format of this value is yyyy-MM-dd'T'HH:mm:ss (in UTC time).
          example: ''
        storageId:
          type: string
          description: The identifier of the storage object returned from the storage system.
          example: ''
        retentionTimestamp:
          type: string
          description: Date to which this document must be at least retained in the document store. The format of this value is yyyy-MM-dd'T'HH:mm:ss (in UTC time).
          example: '2025-09-01T12:34:56'
        documentContentStoreInfos:
          type: array
          description: Meta values of the available document contents.
          items:
            $ref: '#/components/schemas/DocumentContentStoreInfoDTO'
        tags:
          type: array
          description: Additional tags that help to further describe the document (e.g. document source system, context, category...).<p>Tags follow the <em>kebab case</em> naming convention (lowercase, words separated by hyphens)</p>
          example:
          - invoice
          - priority-high
          items:
            type: string
            description: Additional tags that help to further describe the document (e.g. document source system, context, category...).<p>Tags follow the <em>kebab case</em> naming convention (lowercase, words separated by hyphens)</p>
            example: '["invoice","priority-high"]'
        documentInstanceReference:
          $ref: '#/components/schemas/DocumentInstanceReferenceDTO'
    DocumentTemplateSchemaFieldDocumentationDTO:
      type: object
      properties:
