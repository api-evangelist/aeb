      responses:
        '200':
          description: Request has been successfully processed, document instance created
          content:
            application/octet-stream: {}
          links:
            content via id:
              operationRef: document/{documentId}
              parameters:
                documentId: $documentId
              description: Download document content
            content:
              operationRef: documentInstance/{referenceType}/{referenceNumber}/{documentType}
              parameters:
                referenceNumber: $request.path.referenceNumber
                documentType: $request.path.documentType
                referenceType: $request.path.referenceType
              description: Download document content
        '202':
          description: Request is being processed and result link has been sent in response
          links:
            content via id:
              operationRef: document/{documentId}
              parameters:
                documentId: $documentId
              description: Download document content
            content:
              operationRef: documentInstance/{referenceType}/{referenceNumber}/{documentType}
              parameters:
                referenceNumber: $request.path.referenceNumber
                documentType: $request.path.documentType
                referenceType: $request.path.referenceType
              description: Download document content
        '400':
          description: Invalid request parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '404':
          description: Reference object was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '410':
          description: Document has already expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '422':
          description: Document instance was not created (missing document type or unprocessable data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '423':
          description: Document was found but is currently locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
    delete:
      tags:
      - DocumentService
      summary: deleteDocumentInstance
      description: <h3>Delete an existing document instance</h3><p>Deletes the document instance for the given reference object and document type.</p>
      operationId: deleteDocumentInstance
      parameters:
      - name: referenceType
        in: path
        description: Document reference type
        required: true
        schema:
          type: string
        example: SHIPMENT
      - name: referenceNumber
        in: path
        description: Document reference number
        required: true
        schema:
          type: string
        example: 4711
      - name: documentType
        in: path
        description: Document type
        required: true
        schema:
          type: string
        example: DEMODOC
      - name: ignorePendingContent
        in: query
        description: If set to <code>true</code>, the document will be deleted even when the document content is yet being generated or archived. Otherwise (default behavior), the deletion is rejected in such case.
        schema:
          type: boolean
      responses:
        '204':
          description: Document instance was deleted
        '404':
          description: The required data was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '423':
          description: Document was found but is currently locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '425':
          description: Document content pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /DocumentService/documentInstance/{referenceType}/{referenceNumber}:
    get:
      tags:
      - DocumentService
      summary: getDocumentInstances
      description: <h3>Query information on existing document instances</h3><p>Returns the document instances for the given reference object.</p>
      operationId: getDocumentInstances
      parameters:
      - name: referenceType
        in: path
        description: Document reference type
        required: true
        schema:
          type: string
        example: SHIPMENT
      - name: referenceNumber
        in: path
        description: Document reference number
        required: true
        schema:
          type: string
        example: 4711
      - name: onlyCreated
        in: query
        description: Fetch only instances with already created documents
        schema:
          type: boolean
      responses:
        '200':
          description: Request was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentInstancesResponseData'
            application/xml:
              schema:
                $ref: '#/components/schemas/GetDocumentInstancesResponseData'
        '404':
          description: Reference object was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /DocumentService/documentInstance/{documentId}/print:
    post:
      tags:
      - DocumentService
      summary: printDocumentInstance
      description: <h3>Create a print request for document instance.</h3><p>Creates a print request for the requested document. The document must have been created by <code>POST /documentInstance/{referenceType}/{referenceNumber}/{documentType}</code> and defined by its documentId.The printing location depends on the session context (e.g. user/client or workstation) and the printing output settings in the document type of the document.</p><p>The print request is processed asynchronously and may fail if the cloud printing server service is not started on the target machine. When the print request is processed the <b>actual content</b> of the document will be printed, e.g. if the document has been changed since the print request was created the changes will be printed.</p>
      operationId: printDocumentInstance
      parameters:
      - name: documentId
        in: path
        description: The unique documentId for the stored document which has to be printed.
        required: true
        schema:
          type: string
      - name: stopOnError
        in: query
        description: Stop printing when error occurs
        schema:
          type: boolean
      - name: monitorPrintJob
        in: query
        description: Supervise print job until the printing is finished
        schema:
          type: boolean
      - name: notificationDisabled
        in: query
        description: Disable sending print job error email
        schema:
          type: boolean
      - name: notificationEmail
        in: query
        description: Email address to send information about failed print job
        schema:
          type: string
      - name: numberOfCopies
        in: query
        description: 'Number of copies to print (default: 1 or inherited from client/workstation settings if available)'
        schema:
          type: integer
          format: int32
      - name: userName
        in: query
        description: User name (if different from the authentication)
        schema:
          type: string
      - name: workstationId
        in: query
        description: Workstation for print. When the `workstationId` is specified, the print request is attached to the workstation print queue. Otherwise, the print queue of the request user name is used.
        schema:
          type: string
      - name: workstationSessionId
        in: query
        description: ID of the workstation session for local printing (session must be established by caller)
        schema:
          type: string
      - name: validatePrinterName
        in: query
        description: Check that the resolved printer name is available in the provided context. No print request is created if this is not the case.
        schema:
          type: boolean
      - name: retryTimeout
        in: query
        description: Auto-retry timeout for locking (default is 3000ms).
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The data was found and the required content has been sent in the response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintDocumentInstanceResponseData'
            application/xml:
              schema:
                $ref: '#/components/schemas/PrintDocumentInstanceResponseData'
        '404':
          description: Reference object was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '410':
          description: Document has already expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '422':
          description: Printer name validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintDocumentInstanceResponseDTO'
            application/xml:
              schema:
                $ref: '#/components/schemas/PrintDocumentInstanceResponseDTO'
        '423':
          description: Document was found but is currently locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '425':
          description: Document content pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /DocumentService/documentInstanceTrusted/{referenceType}/{referenceNumber}/{documentType}:
    put:
      tags:
      - DocumentService
      summary: updateDocumentInstanceTrusted
      description: <h3>Generate a new document instance.</h3>Access is restricted to <code>I_DOCUMENTSERVICEBF_TRUSTED</code> role.<br/><p>Like <code>PUT /documentInstance/{referenceType}/{referenceNumber}/{documentType}</code> but with less limitations to the uploaded contents.</p>
      operationId: updateDocumentInstanceTrusted
      parameters:
      - name: referenceType
        in: path
        description: Document reference type
        required: true
        schema:
          type: string
        example: SHIPMENT
      - name: referenceNumber
        in: path
        description: Document reference number
        required: true
        schema:
          type: string
        example: 4711
      - name: documentType
        in: path
        description: Document type
        required: true
        schema:
          type: string
        example: INVOICE
      - name: autoCreateRefObject
        in: query
        description: Automatically create reference object
        schema:
          type: boolean
          default: true
        example: true
      - name: fileName
        in: query
        description: Document file name
        schema:
          type: string
        example: INV_4711.pdf
      - name: retentionDaysLimit
        in: query
        description: How long should the generated document be retained (max 90 days)
        schema:
          type: integer
          format: int32
        example: 3
      - name: storageRetentionDaysLimit
        in: query
        description: How long should the generated document be retained in storage (applicable only with archive activation)
        schema:
          type: integer
          format: int32
        example: 300
      - name: userName
        in: query
        description: User name (if different from the authentication)
        schema:
          type: string
      - name: tag
        in: query
        description: Additional tags that help to further describe the document (e.g. document source system, context, category...) and allows it to be found again by browsing and searching. <p>Tags <i>must</i> follow the kebab case naming convention(lowercase, and words are separated by hyphens)</p>Existing tags are retained if no value is defined. Defined values replace the existing tags. To delete all text without creating a tag, an empty tag has to be defined (e.g. `&tag=`)
        schema:
          type: array
          items:
            type: string
        example:
        - foo
        - bar
      - name: printerModelString
        in: query
        description: Model of the printer (aka printer type) for which the printable printer raw data applies (<i>only relevant for content-type "print/raw"</i>)<br /><i>Example :</i> ZEBRA GK420d
        schema:
          type: string
      - name: printerId
        in: query
        description: Some ERP systems responsible for printing need more information about the printer (<i>only relevant for content-type "print/raw"</i>)
        schema:
          type: string
      - name: resolution
        in: query
        description: Print resolution in DPI (<i>only relevant for content-type "image/*"</i>)
        schema:
          type: integer
          format: int32
      - name: offsetX
        in: query
        description: X offset in mm (<i>only relevant for content-type "image/*"</i>)
        schema:
          type: integer
          format: int32
      - name: offsetY
        in: query
        description: Y offset in mm (<i>only relevant for content-type "image/*"</i>)
        schema:
          type: integer
          format: int32
      requestBody:
        description: Document data
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Document instance was updated
          links:
            content via id:
              operationRef: document/{documentId}
              parameters:
                documentId: $documentId
              description: Download document content
            content:
              operationRef: documentInstance/{referenceType}/{referenceNumber}/{documentType}
              parameters:
                referenceNumber: $request.path.referenceNumber
                documentType: $request.path.documentType
                referenceType: $request.path.referenceType
              description: Download document content
        '403':
          description: Access denied, restricted to I_DOCUMENTSERVICEBF_TRUSTED role.
        '404':
          description: Reference object was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '410':
          description: Document has already expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '422':
          description: Document instance was not created (missing document type or unprocessable data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '423':
          description: Document was found but is currently locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /DocumentService/referenceObject/{referenceType}/{referenceNumber}:
    get:
      tags:
      - DocumentService
      summary: getDocumentReferenceObject
      description: <h3>Find one document reference object</h3><p>Returns the requested document reference object if it is available for the user.</p>
      operationId: getDocumentReferenceObject
      parameters:
      - name: referenceType
        in: path
        description: Unique Id of the reference type
        required: true
        schema:
          type: string
        example: SHIPMENT
      - name: referenceNumber
        in: path
        description: Unique Id of the reference number
        required: true
        schema:
          type: string
        example: 4711
      responses:
        '200':
          description: The data was found and the required content has been sent in the response
          content:
            application/json: {}
            application/xml: {}
        '404':
          description: The required data was not found
    put:
      tags:
      - DocumentService
      summary: updateDocumentReferenceObject
      description: <h3>Create or update document reference object.</h3><p>Creates new or updates existing document reference object.</p>
      operationId: updateDocumentReferenceObject
      parameters:
      - name: referenceType
        in: path
        description: Unique Id of the reference type
        required: true
        schema:
          type: string
        example: SHIPMENT
      - name: referenceNumber
        in: path
        description: Unique Id of the reference number
        required: true
        schema:
          type: string
        example: 4711
      responses:
        '204':
          description: Reference object was created/updated
        '404':
          description: The required data was not found
        '423':
          description: Reference object is locked
    delete:
      tags:
      - DocumentService
      summary: deleteDocumentReferenceObject
      description: <h3>Delete an existing document reference object</h3><p>Deletes the document reference object with the requested <code>referenceType</code> and <code>referenceNumber</code> along with all its documents (optionally the documents can be preserved).</p>
      operationId: deleteDocumentReferenceObject
      parameters:
      - name: referenceType
        in: path
        description: Unique Id of the reference type
        required: true
        schema:
          type: string
        example: SHIPMENT
      - name: referenceNumber
        in: path
        description: Unique Id of the reference number
        required: true
        schema:
          type: string
        example: 4711
      - name: preserveDocuments
        in: query
        description: If activated, the documents are not deleted
        schema:
          type: boolean
      responses:
        '204':
          description: Reference object was successfully deleted
        '404':
          description: The required data was not found
        '423':
          description: Reference object is locked
  /DocumentService/referenceObject/{referenceType}:
    get:
      tags:
      - DocumentService
      summary: queryDocumentReferenceObjects
      description: <h3>Search document reference objects</h3><p>Executes a search query on the document reference objects. Only the document reference objects that are visible to the caller (session user and session client) are returned. The results can be sorted by predefined criteria, the limit of the number of results is configurable, too.</p>
      operationId: queryDocumentReferenceObjects
      parameters:
      - name: referenceType
        in: path
        description: Criteria for the reference type of the document reference objects. Only reference objects that exactly match the reference type pattern will be returned.
        required: true
        schema:
          type: string
        example: SHIPMENT
      - name: returnTotalCount
        in: query
        description: If <code>true</code>, the total number of document reference objects found is returned in field <code>totalCount</code>. The total number can be different from the number of returned reference objects in case <code>maxResults</code> value is exceeded.
        schema:
          type: boolean
      - name: maxResults
        in: query
        description: Defines how many document reference objects will be returned. The number must not exceed the maximum value of <code>100</code>If no value is passed, default value <code>30</code> will be set.
        schema:
          type: integer
          format: int32
      - name: skipFirst
        in: query
        description: Number of document reference objects that will be skipped before collecting results. Use this to retrieve other document reference objects (next page) if a previous query did not return all of the required document reference objects. The number must not exceed <code>10000</code>.
        schema:
          type: integer
          format: int32
      - name: orderBy
        in: query
        description: 'Defines how the requested document reference objects are sorted.<ul><li><code>REFERENCE_NUMBER_ASC</code> : <i>Sorted by reference number, alphabetically ascending.</i></li><li><code>REFERENCE_NUMBER_DESC</code> : <i>Sorted by reference number, alphabetically descending.</i></li></ul>'
        schema:
          type: string
          enum:
          - REFERENCE_NUMBER_ASC
          - REFERENCE_NUMBER_DESC
      responses:
        '200':
          description: The data was found and the required content has been sent in the response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDocumentReferenceObjectsResponseDTO'
            application/xml:
              schema:
                $ref: '#/components/schemas/GetDocumentReferenceObjectsResponseDTO'
        '404':
          description: The required data was not found
  /DocumentService/printRequest/{printRequestId}:
    get:
      tags:
      - DocumentService
      summary: getPrintRequest
      description: <h3>Get information on print request state</h3><p>Returns the state of a print request identified by its unique ID (obtained by <code>POST /documentInstance/{documentId}/print</code>).</p>
      operationId: getPrintRequest
      parameters:
      - name: printRequestId
        in: path
        description: The unique ID of the print request for which the state is requested.
        required: true
        schema:
          type: string
        example: print_request_id
      - name: userName
        in: query
        description: User name (if different from the authentication).
        schema:
          type: string
      - name: workstationId
        in: query
        description: The unique identifier of the workstation (must be unique within the same client) for which the print request was created.
        schema:
          type: string
      responses:
        '200':
          description: The print request state data has been sent in the response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPrintRequestStateResponseData'
            application/xml:
              schema:
                $ref: '#/components/schemas/GetPrintRequestStateResponseData'
    post:
      tags:
      - DocumentService
      summary: updatePrintRequest
      description: <h3>Update print request</h3><p>Updates a print request identified by its unique ID (obtained by <code>POST /documentInstance/{documentId}/print</code>) with a specific action.</p>
      operationId: updatePrintRequest
      parameters:
      - name: printRequestId
        in: path
        description: The unique ID of the print request for which the state is requested.
        required: true
        schema:
          type: string
        example: print_request_id
      - name: userName
        in: query
        description: User name (if different from the authentication).
        schema:
          type: string
      - name: workstationId
        in: query
        description: The unique identifier of the workstation (must be unique within the same client) for which the print request was created.
        schema:
          type: string
      - name: action
        in: query
        description: 'Defines the type of action on specified print request.<ul><li><code>CANCEL</code> : <i>The pool is contacted with request to cancel selected request</i></li><li><code>IGNORE</code> : <i>Print request is being ignored.</i></li><li><code>RESET</code> : <i>Printing process is reset.</i></li></ul>'
        required: true
        schema:
          type: string
          enum:
          - CANCEL
          - IGNORE
          - RESET
      - name: timeout
        in: query
        description: Action timeout in seconds; currently applicable to CANCEL only, this parameter allows to set maximum time to wait for selected action to finish.
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Print request was updated and its state has been sent in the response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePrintRequestResponseData'
            application/xml:
              schema:
                $ref: '#/components/schemas/UpdatePrintRequestResponseData'
        '400':
          description: Print request action failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '404':
          description: Print request was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '423':
          description: Print request is locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
    delete:
      tags:
      - DocumentService
      summary: deletePrintRequest
      description: <h3>Delete print request.</h3><p>Removes a specific print request identified by its unique ID (obtained by <code>POST /documentInstance/{documentId}/print</code>).</p>
      operationId: deletePrintRequest
      parameters:
      - name: printRequestId
        in: path
        description: The unique ID of the print request for which the state is requested.
        required: true
        schema:
          type: string
        example: print_request_id
      - name: userName
        in: query
        description: User name (if different from the authentication).
        schema:
          type: string
      - name: workstationId
        in: query
        description: The unique identifier of the workstation (must be unique within the same client) for which the print request was created.
        schema:
          type: string
      responses:
        '204':
          description: Print request was deleted
        '400':
          description: Print request deletion failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '423':
          description: Print request is locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /DocumentService/printRequest:
    get:
      tags:
      - DocumentService
      summary: getPrintRequests
      description: '<h3>Get information on print requests</h3><p>Returns list of all print requests for the specified queue (default: active only). The state of the queue may influence the individual request states.</p>'
      operationId: getPrintRequests
      parameters:
      - name: onlyActive
        in: query
        description: Only active print requests
