        description: Requests created after the given time
        schema:
          type: string
          format: date-time
        example: '2020-01-01 00:00:00'
      - name: userName
        in: query
        description: User name (if different from the authentication).
        schema:
          type: string
      - name: workstationId
        in: query
        description: The unique identifier of the workstation (must be unique within the same client) for which the print request was created.
        schema:
          type: string
      responses:
        '200':
          description: List of matching print requests has been sent in the response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPrintRequestsResponseData'
            application/xml:
              schema:
                $ref: '#/components/schemas/GetPrintRequestsResponseData'
  /DocumentService/util/processor/{processor}:
    get:
      tags:
      - DocumentService
      summary: getProcessorInfo
      description: <h3>Fetch processor detailed information</h3><p>Returns an information on functions and/or features supported by the processor.<br/>Supported output formats are controlled by the <code>Accept</code> header. Currently only <code>application/json</code> and <code>application/xml</code> are available.</p>
      operationId: getProcessorInfo
      parameters:
      - name: processor
        in: path
        description: Document processor tag
        required: true
        schema:
          type: string
        example: PDF-XFA
      responses:
        '200':
          description: The data was found and the required content has been sent in the response
          content:
            application/json: {}
            application/xml: {}
  /DocumentService/util/processor:
    get:
      tags:
      - DocumentService
      summary: getSupportedProcessors
      description: <h3>Fetch supported processors</h3><p>Collects tags of all document processors that are supported in this service.</p>
      operationId: getSupportedProcessors
      responses:
        '200':
          description: The data was found and the required content has been sent in the response
          content:
            application/json: {}
            application/xml: {}
  /DocumentService/util/schemaToXsd:
    post:
      tags:
      - DocumentService
      summary: schemaToXsd
      description: <h3>Convert proprietary schema descriptor to XSD format</h3>
      operationId: schemaToXsd
      requestBody:
        description: Schema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaToXsdRequestDTO'
          application/xml:
            schema:
              $ref: '#/components/schemas/SchemaToXsdRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/xml: {}
  /DocumentService/util/xsdToSchema:
    post:
      tags:
      - DocumentService
      summary: xsdToSchema
      description: <h3>Convert XSD input to a proprietary schema descriptor</h3>Supported output formats are controlled by the <code>Accept</code> header. Currently only <code>application/json</code> and <code>application/xml</code> are available.</p>
      operationId: xsdToSchema
      requestBody:
        description: XSD schema to convert
        content:
          application/xml:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Conversion was successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XsdToSchemaResponseDTO'
            application/xml:
              schema:
                $ref: '#/components/schemas/XsdToSchemaResponseDTO'
        '400':
          description: Conversion was not successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
components:
  schemas:
    DocumentInstanceReferenceDTO:
      required:
      - documentReferenceObjectRef
      - documentTypeRef
      type: object
      properties:
        documentTypeRef:
          $ref: '#/components/schemas/DocTypeReferenceDTO'
        documentReferenceObjectRef:
          $ref: '#/components/schemas/DocumentReferenceObjectReferenceDTO'
