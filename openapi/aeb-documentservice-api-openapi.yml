    post:
      tags:
      - DocumentService
      summary: updateDocument
      description: "<h3>Update an existing document or generate it in a different format either synchronously (wait for the result) or asynchronously (enqueue document creation and get the result later with the documentId).</h3> <p> Possibilities to update the stored document contents:<br /> <ul>   <li>`xml/json` data is filled + any of <b>Processing Options</b> is filled:<br />   \tThe contents of the document are completely replaced by newly created ones</li>   <li>`xml/json` data is <em>not</em> filled + any of <b>Processing Options</b> is filled:<br />   \tThe contents are created or updated using the existing document data stored together with the document.<br />   \tExisting contents are retained. For example, it allows to add content in a new format.</li>   <li>`xml/json` data is filled + none of <b>Processing Options</b> is filled:<br />   \tAll existing contents are recreated/updated with the new document data.</li> </ul> </p> If the stored document is archived a new revision will be created in the connected archive."
      operationId: updateDocument_1
      parameters:
      - name: documentId
        in: path
        description: Unique document id (as returned from POST/PUT/GET document)
        required: true
        schema:
          type: string
        example: 012345678-abcd-4eff-9876-543210fedcba
      - name: async
        in: query
        description: Asynchronous document creation. If `true`, the request returns immediately, whereas the document is being prepared in the background.
        schema:
          type: boolean
          default: false
      - name: processor
        in: query
        description: <b>Processing Options:</b> Document processor tag
        schema:
          type: string
        example: PDF-XFA
      - name: templateName
        in: query
        description: <b>Processing Options:</b> Document template name
        schema:
          type: string
        example: DemoDoc10.pdf
      - name: format
        in: query
        description: <b>Processing Options:</b> Format of the generated document (one of the formats supported by the processor)
        schema:
          type: string
        examples:
          pdf:
            description: PDF version 1.5 including layout and data (standard for e-distribution)
            value: PDF
          pdf_data:
            description: PDF version 1.5, only data - no layout
            value: PDF data
          pdfa:
            description: PDF/a including layout and data
            value: PDFa
          pdfa_data:
            description: PDF/a, only data - no layout
            value: PDFa data
      - name: documentLocale
        in: query
        description: <b>Processing Options:</b> Language of the generated document (if applicable)
        schema:
          type: string
      - name: documentName
        in: query
        description: <b>Processing Options:</b> Suggested base file name of the generated document (without extension)
        schema:
          type: string
        example: DEMO_4711
      - name: referenceNumber
        in: query
        description: <b>Staging Options:</b> Document reference number
        schema:
          type: string
        example: 4711
      - name: referenceType
        in: query
        description: <b>Staging Options:</b> Document reference type
        schema:
          type: string
        example: SHIPMENT
      - name: documentType
        in: query
        description: <b>Staging Options:</b> Document type
        schema:
          type: string
        example: DEMODOC
      - name: retentionDaysLimit
        in: query
        description: <b>Staging Options:</b> How long should the generated document be retained (max 90 days)
        schema:
          maximum: 90
          type: integer
          format: int32
        example: 3
      - name: tag
        in: query
        description: <b>Staging Options:</b> Additional tags that help to further describe the document (e.g. document source system, context, category...) and allows it to be found again by browsing and searching.<p>Tags <b>must</b> follow the <em>kebab case</em> naming convention (lowercase, words separated by hyphens)</p><p>Existing tags are retained if no value is defined. Defined values replace the existing tags. To delete all text without creating a tag, an empty tag has to be defined (e.g. `&tag=`)</p>
        schema:
          type: array
          items:
            type: string
        example:
        - foo
        - bar
      requestBody:
        description: Document data (XML or JSON format - must match the provided 'ContentType' header)
        content:
          application/xml:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Request has been successfully processed, document updated and result link has been sent in response header.
          content:
            '*/*':
              schema:
                type: string
                description: Updated document content
                format: binary
                example: '...'
          links:
            content:
              operationRef: document/{documentId}
              parameters:
                documentId: $documentId
              description: Download document content
        '202':
          description: Request is being processed asynchronously and result link has been sent in response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepareDocumentResponseDTO'
            application/xml:
              schema:
                $ref: '#/components/schemas/PrepareDocumentResponseDTO'
          links:
            content:
              operationRef: document/{documentId}
              parameters:
                documentId: $documentId
              description: Download document content
        '400':
          description: Missing or invalid request data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '404':
          description: The requested document was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '410':
          description: The content of the requested document has expired and is no more available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '423':
          description: The requested document was found but it is currently locked. Retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
