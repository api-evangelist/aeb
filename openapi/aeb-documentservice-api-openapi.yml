    QueryDocumentsByIdRequestDTO:
      type: object
      properties:
        clientSystemId:
          type: string
          description: '<p>Id of the sending client system.</p><p>e.g. Installation ID of the sending host or ERP system.</p><p>Maximum length: 20</p>'
          example: TEST_ID
        clientIdentCode:
          type: string
          description: '<p>Client identification code.</p><p>Maximum length: 10</p>'
          example: APITEST
        userName:
          type: string
          description: <p>User who initiated the request from the client system.</p><p>If the user is found either in the system's user management or in a connected LDAP directory, the request runs under this user's roles.</p><p>If the user is not found, the request is only granted the basic 'I_EVERYONE' role. The user name may be used for logging purposes in this case.</p><p>Actual authentication is handled separately via the request's headers, so no password is required in the request's data.</p>
          example: API_TEST
        resultLanguageIsoCodes:
          type: array
          description: <p>2-letter ISO codes of the languages in which texts will be returned.</p><p>English ('en') and German ('de') are typically supported by default. Other languages may be supported.</p><p>Translations will be looked up in the order of the provided language codes. If a translation is not available in one language, the next language is used instead.</p>
          example:
          - en
          - de
          items:
            type: string
            description: <p>2-letter ISO codes of the languages in which texts will be returned.</p><p>English ('en') and German ('de') are typically supported by default. Other languages may be supported.</p><p>Translations will be looked up in the order of the provided language codes. If a translation is not available in one language, the next language is used instead.</p>
            example: '["en","de"]'
        createdAtRange:
          $ref: '#/components/schemas/DateTimeIntervalRangeFilterDTO'
        returnTotalCount:
          type: boolean
          description: If <code>true</code>, total number of documents found is returned in field <code>totalCount</code>. Total number can be different from number of actually returned documents in case total document count exceeds the value of <code>maxResults</code>
          example: false
        maxResults:
          type: integer
          description: 'Limits how many documents can be returned in a single request.<br><i>Minimum: 1</i><br><i>Maximum: 100</i><br><i>Default: 30</i>'
          format: int32
          example: 30
        skipFirst:
          type: integer
          description: If set, defines the number of documents that will be skipped before collecting results. Use this to retrieve further documents if a previous query did not return all required documents. The number must not exceed 10000
          format: int32
          example: 0
        orderBy:
          type: string
          description: 'Defines how the requested documents are sorted.<ul><li><code>CREATED_AT_ASC</code> : <i>Sorted by date/time of document creation, oldest first.</i></li><li><code>CREATED_AT_DESC</code> : <i>Sorted by date/time of document creation, newest first.</i></li><li><code>REFERENCE_NUMBER_ASC</code> : <i>Sorted by document reference number, alphabetically ascending.</i></li><li><code>REFERENCE_NUMBER_DESC</code> : <i>Sorted by document reference number, alphabetically descending.</i></li><li><code>REFERENCE_TYPE_ASC</code> : <i>Sorted by document reference type, alphabetically ascending.</i></li><li><code>REFERENCE_TYPE_DESC</code> : <i>Sorted by document reference type, alphabetically descending.</i></li></ul>'
          example: CREATED_AT_ASC
          enum:
          - CREATED_AT_ASC
          - CREATED_AT_DESC
          - REFERENCE_NUMBER_ASC
          - REFERENCE_NUMBER_DESC
          - REFERENCE_TYPE_ASC
          - REFERENCE_TYPE_DESC
        documentIdInList:
          maxItems: 1000
          type: array
          description: List of document IDs (max. 1000 elements allowed). Only documents exactly matching these IDs will be returned.
          items:
            type: string
            description: A single document ID
            default: documentId
