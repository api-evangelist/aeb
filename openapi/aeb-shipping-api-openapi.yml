    DLPickupCreationParmsDTO:
      required:
      - creationMode
      type: object
      properties:
        creationMode:
          type: string
          description: '<p> Controls the creation of the pickup (if a new pickup is to create) and the handling of the shipments that should be assigned to it.<br> The basic requirement for a pickup to be created is that the header data (like carrier, shipping date etc.) is filled correctly. The creationMode controls how to deal with the pickup''s shipments. Valid values are: <li>ONLY_VALID_SHIPMENTS The pickup is only created or updated, when all of the shipment references are correct and the referenced shipments are suitable for the pickup. <li>INVALID_SHIPMENTS_ALLOWED The pickup is created or updated even if some shipments can''t be found (incorrect references), they do not match the pickup ( different carrier etc.) or their status doesn''t allow pickup assignment. For each incorrect shipment a warning is returned and the shipment is not assigned to the pickup. To correct the pickup, the GUI or an application facade has to be used or the shipment has to be retransmitted after correction via a <code>processPickup</code> call. </p> Mandatory field.<br> <p> length=30 </p>'
      description: Creation parameters for a shipment. Specifies when and how to create a pickup and the shipment it contains.
    DLProcessPickupResponseDTO:
      type: object
      properties:
        hasErrors:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>An error usually means that the request could not be performed.</p><p>Error details are provided in the messages[] array.</p>
          example: false
        hasOnlyRetryableErrors:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>Error details are provided in the messages[] array.</p>
          example: true
        hasWarnings:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>Error details are provided in the messages[] array.</p>
          example: true
        messages:
          type: array
          description: <p>Error or warning messages at the request level.</p><p>There may be additional messages[] arrays at lower data levels as specified in the documentation.</p>
          items:
            $ref: '#/components/schemas/ResponseMessageDTO'
        documents:
          type: array
          description: The documents (manifests) of the pickup. Only filled, when specified in <code>documentOutputMode</code> of request.
          items:
            $ref: '#/components/schemas/DLDocumentDTO'
      description: Response DTO for the printDocumentsForPickup business facade method
      xml:
        name: processPickupResponseDTO
    DLPickupProcessParmsDTO:
      required:
      - doManifest
      - documentOutputMode
      - workstationId
      type: object
      properties:
        doManifest:
          type: boolean
          description: <p> 'true' or '1' = The shipment pickup is manifested. That means, that EDI data is sent to the carrier and the pickup is sealed, it cannot be changed, no shipments can be added or removed anymore. </p> <p> 'false' or '0' = The shipment pickup is left open, no EDI data is sent to the carrier yet, shipments can be added or removed using the GUI. If the pickup has already been manifested, nothing is done. </p>
        documentOutputMode:
          $ref: '#/components/schemas/DLDocumentOutputModeDTO'
        workstationId:
          type: string
          description: The workstation where the documents should be printed out in the case of direct printing. <p> length=50 </p>
