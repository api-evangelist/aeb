          description: '<p> The shipment''s current status. Possible values are: <li>NEW This status is reached as soon as the shipment is created. <li>READY This status is reached as soon as all required fields for  printing labels are entered. <li>RDYFORCOMPLETE This status is reached as soon as all required  fields of all packages are entered. <li>COMPLETE This status is reached as soon as the labels are printed  and the shipment can be disposed to a pickup. <li>RDYFORDISPOSE This status is reached as soon as the shipment can  be disposed to a pickup. <li>DISPOSED This status is reached as soon as the shipment has been  disposed to a pickup. <li>RDYFORSHIPPING This status is reached as soon as the shipment is  fully prepared for shipping and all necessary preconditions are met. <li>SHIPPED This status is reached as  soon as the pickup of the  shipment has been manifested. <li>DELETED This reached status is reached as soon as the shipment  is canceled. </p>'
