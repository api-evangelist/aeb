    DLDocumentOutputModeDTO:
      required:
      - mode
      type: object
      properties:
        mode:
          type: string
          description: '<p> The output mode for the documents. Valid values are: <li>PRINT The documents will be automatically printed on the client system. A print job agent has to be installed and activated there. <li>RETURN The print data of the documents will be returned to the client system to be printed there. This is also the default when mode is left empty. <li>NONE No documents will be returned or printed. </P> <br> <p> length=15 </p>'
        includeDocumentId:
          type: boolean
          description: <p> Only relevant for mode RETURN. Controls, if the document ID (field DLDocumentDTO#documentId) should be filled. Defaults to "false". </p>
        includeContent:
          type: boolean
          description: <p> Only relevant for mode RETURN. Controls, if the document content (field DLDocumentDTO#content) should be filled. Use this setting if you only need reference data of the documents but not the actual content. Defaults to "true". </p>
      description: DTO specifying the output mode for documents.
    DLAdditionalValueDTO:
