    DLHazardousGoodsItemRequestDataDTO:
      required:
      - hazardRegulation
      type: object
      properties:
        transactionId:
          type: string
          description: <p> The shipment wide unique id for the hazardous goods item. </p> <p> length=50 </p>
        unNumber:
          type: string
          description: UN number <p> length=8 <p>
        hazardRegulation:
          type: string
          description: 'Hazardous regulation to be applied. Valid values are: <ul> <li>ADR</li> <li>ADG</li> <li>NZDG</li> <li>IATA</li> <li>IMDG</li> <li>TDG</li> <li>CFR</li> </ul> <p> length=10 <p>'
        technicalName:
          type: string
          description: Technical name <p> length=250 <p>
        hazardAdditionalDescription:
          type: string
          description: Additional description <p> length=250 <p>
        hazardousGoodsType:
          type: string
          description: "Indicates the type of hazardous goods packaged in the package. Valid values are: <li>UNDEFINED\t\t(not defined, the type is determined by the hazardous good's package) <li>NORMAL \t(hazardous goods) <li>EQ\t\t(excepted quantities) <li>LQ\t\t(limited quantities) <li>US_ORMD\t\t(other regulated materials for domestic transport only) - Since 2021 this code is not used anymore <li>US_SMALL_QUANTITY\t\t(small quantity regulated materials) - only relevant for US"
        hazardClass:
          type: string
          description: 'Hazardous class. Valid values are: <ul> <li>1</li> <li>1.1</li> <li>1.2</li> <li>1.3</li> <li>1.4</li> <li>1.5</li> <li>1.6</li> <li>2</li> <li>2.1</li> <li>2.2</li> <li>2.3</li> <li>3</li> <li>4</li> <li>4.1</li> <li>4.2</li> <li>4.3</li> <li>5</li> <li>5.1</li> <li>5.2</li> <li>6</li> <li>6.1</li> <li>6.2</li> <li>7</li> <li>7A</li> <li>7B</li> <li>7C</li> <li>7E</li> <li>8</li> <li>9</li> <li>NONE</li> </ul> <p> length=10 <p>'
        subriskClass1:
          type: string
          description: 'Sub risk 1 hazardous class. Valid values are: <ul> <li>1</li> <li>1.1</li> <li>1.2</li> <li>1.3</li> <li>1.4</li> <li>1.5</li> <li>1.6</li> <li>2</li> <li>2.1</li> <li>2.2</li> <li>2.3</li> <li>3</li> <li>4</li> <li>4.1</li> <li>4.2</li> <li>4.3</li> <li>5</li> <li>5.1</li> <li>5.2</li> <li>6</li> <li>6.1</li> <li>6.2</li> <li>7</li> <li>7A</li> <li>7B</li> <li>7C</li> <li>7E</li> <li>8</li> <li>9</li> <li>NONE</li> </ul> <p> length=10 <p>'
        subriskClass2:
          type: string
          description: 'Sub risk 2 hazardous class. Valid values are: <ul> <li>1</li> <li>1.1</li> <li>1.2</li> <li>1.3</li> <li>1.4</li> <li>1.5</li> <li>1.6</li> <li>2</li> <li>2.1</li> <li>2.2</li> <li>2.3</li> <li>3</li> <li>4</li> <li>4.1</li> <li>4.2</li> <li>4.3</li> <li>5</li> <li>5.1</li> <li>5.2</li> <li>6</li> <li>6.1</li> <li>6.2</li> <li>7</li> <li>7A</li> <li>7B</li> <li>7C</li> <li>7E</li> <li>8</li> <li>9</li> <li>NONE</li> </ul> <p> length=10 <p>'
        classificationCode:
          type: string
          description: Classification code <p> length=4 <p>
        tunnelCode:
          type: string
          description: Tunnel restriction code <p> length=10 <p>
        packagingGroup:
          type: string
          description: 'Hazardous packaging group. Valid Values are: <ul> <li>NONE</li> <li>I</li> <li>II</li> <li>III</li> </ul> <p> length=10 <p>'
        packingInstruction:
          type: string
          description: 'IATA packing instruction. Consists of the instruction code (up to three digits with optional prefix Y) optionally followed by a section identification (up to two upper case characters). Instruction code and section must be separated by an underscore. The section identification is mandatory for lithium batteries otherwise the instruction code alone is sufficient. Example Values are: <ul> <li>203</li> <li>350</li> <li>Y203</li> <li>965_IA</li> <li>965_IB</li> <li>965_I</li> </ul> <p> length=10 </p>'
        specialProvision:
          type: string
          description: 'Special provisions for the carriage of hazardous goods. Consists of the provision code (up to three digits) or the chapter specification (up to three digits), optionally followed by sub-chapters (up to two digits or one digit and an upper case character). Chapter and subchapters must be separated by a dot. Also possible are 3 capital letters + hyphen, followed by further numbers or letters or 1 capital letter followed by numbers. Example Values are: <ul> <li>188</li> <li>2.2.9.1.7</li> <li>63.3A</li> <li>USG-...</li> <li>A213</li> </ul> <p> length=20 </p>'
        multiplicator:
          type: string
          description: 'Hazardous multiplicator. Valid Values are: <ul> <li>NONE</li> <li>0</li> <li>1</li> <li>3</li> <li>50</li> <li>INFINITE</li> </ul> <p> length=10 <p>'
        packageTypeIdentCode:
          type: string
          description: IdentCode of the package type. Valid values are depending on the client's package types in the master file data. <p> length=20 </p>
        hazardWeight:
          $ref: '#/components/schemas/QuantityDTO'
        hazardNetQuantity:
          $ref: '#/components/schemas/QuantityDTO'
        netExplosiveWeight:
          $ref: '#/components/schemas/QuantityDTO'
        numberOfPackages:
          type: integer
          description: Number of packages <p> length=10 </p>
          format: int32
        hazardLabel:
          type: string
          description: Hazardous label <p> length=10 </p>
        transportCategory:
          type: string
          description: 'Transport category. Valid Values are: <ul> <li>NONE</li> <li>0</li> <li>1</li> <li>2</li> <li>3</li> <li>4</li> </ul> <p> length=4 <p>'
        specialSubstanceType:
          type: string
          description: 'Special Substance type. Valid Values are: <ul> <li>NONE</li> <li>BIOLOGICAL_SUBSTANCE</li> <li>DRY_ICE</li> <li>GENETICALLY_MODIFIED_ORGANISM</li> <li>LITHIUM_BATTERY</li> <li>RADIOACTIVE_SUBSTANCE</li> </ul> <p> length=30 <p>'
        hazardPoints:
          type: integer
          description: Hazardous points <p> length=5 </p>
          format: int32
        flashPoint:
          type: string
          description: Flash point <p> length=20 </p>
        specialProvisionMarking:
          type: string
          description: 'Indicates if the special provision has to be marked. Valid Values are: <ul> <li>REQUIRED</li> <li>NOT_REQUIRED</li> </ul> <p> length=20 <p>'
        emergencyContact:
          $ref: '#/components/schemas/DLPersonDTO'
        transportAuthorization:
          type: string
          description: Transport authorization. Additional information that may be required by regulation about a hazardous material such as DOT-SP number (Special Permit), LAA number... <p> length=250 </p>
        packingInstructionMarking:
          type: string
          description: 'Indicates if the packing instruction has to be marked. Valid Values are: <ul> <li>REQUIRED</li> <li>NOT_REQUIRED</li> </ul> <p> length=20 <p>'
        marinePollutant:
          type: string
          description: 'Indicates if the substance is a marine pollutant according to IMDG or CFR. When no value is given, default is NO_POLLUTANT. Valid Values are: <ul> <li>NO_POLLUTANT</li> <li>POLLUTANT</li> <li>SEVERE_POLLUTANT</li> </ul> <p> length=20 <p>'
        controlTemperature:
          type: string
          description: The control temperature according to IMDG or CFR. <p> length=4 <p>
        emergencyTemperature:
          type: string
          description: The emergency temperature according to IMDG or CFR. <p> length=4 <p>
        isEnvironmentallyHazardous:
          type: boolean
          description: Indicates if the substance is environmentally hazardous according to ADR or IATA.
        isReportableQuantity:
          type: boolean
          description: Indicates if package contains hazardous materials in an amount that needs to be reported.
        isTransportByCargoAircraftOnly:
          type: boolean
          description: Indicates if the transportation is only allowed in the cargo aircraft.
        isNotRegulated:
          type: boolean
          description: Indicates if no hazardous goods exist in accordance with the regulations.
        additionalValues:
          $ref: '#/components/schemas/GenericDataRecordDTO'
      description: DTO for request information of a DLHazardousGoodsItem.
