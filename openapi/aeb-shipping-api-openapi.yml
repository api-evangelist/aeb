          type: string
          description: '<p> The mode in which the operation is processed. Valid values are: <li>BASIC the operation is processed in an asynchronous job. <li>EXTENDED the operation is executed directly within the webservice request transaction and no response is returned until the process is finished. </p> <br> <p> length=10 </p>'
      description: DTO specifying the mode in which an operation is processed.
    DLPackageProcessingResultDTO:
      type: object
      properties:
        hasErrors:
          type: boolean
          description: True, if there are any error messages. If an error has occured the messages contain more details about the errors.
        hasWarnings:
          type: boolean
          description: True, if there are any warning messages.
        messages:
          type: array
          description: Messages for the whole request, e.g. for errors or warnings.<br>
          items:
            $ref: '#/components/schemas/ResponseMessageDTO'
        packageTransactionId:
          type: string
          description: <p> The shipment wide unique id for the package (as specified in the request) the result is for. </p> <p> length=50 </p>
        referenceNumber1:
          type: string
          description: Another package reference number (as specified in the request) the result is for. <p> length=50 </p>
        carrierPackageNumber:
          type: string
          description: The package number given by the carrier. Usually the tracking number. <p> length=50 </p>
        carrierPackageNumberReturn:
          type: string
          description: The additional return tracking number given by the carrier, if the data for the possible return shipment are to be generated with the initial shipping data.  <p> length=50 </p>
        carrierTrackingURL:
          type: string
          description: The tracking URL of the package.<p> length=512 </p>
        carrierTrackingURLReturn:
          type: string
          description: The additional return tracking URL of the package.<p> length=512 </p>
        carrierPackageIdentBarcode:
          type: string
          description: 'The content of the barcode identifying the package as defined by the carrier. The carrierPackageNumber is most likely part of the carrierPackageIdentBarcode and for same carrier it is identical. However, this depends solely on the carriers'' specification. NOTE: this is currently in BETA phase and only supported for a very small number of carriers. <p> length=50 </p>'
        documents:
          type: array
          description: The documents for the package. Only filled when asked for in request (documentOutputMode).
          items:
            $ref: '#/components/schemas/DLDocumentDTO'
      description: DTO holding result information of a package processing.<br> The package is created and basic validation checks are performed synchronously.<br> The carrier data preparation for EDI and label generation will be performed asynchronously, so the preparation results (e.g. labels and tracking number) are not part of the response. This information can be retrieved with a <code>syncShipments</code> call.
    DLShipmentProcessParmsDTO:
      required:
      - doCompletion
      - documentOutputMode
      - documentOutputScope
      - documentPrepareScope
      - processMode
      - workstationId
      type: object
      properties:
        processMode:
          $ref: '#/components/schemas/DLProcessModeDTO'
        documentPrepareScope:
          $ref: '#/components/schemas/DLDocumentScopeDTO'
        workstationId:
          type: string
          description: <p> The workstation used to detect the printer for which the documents should be prepared, printed or returned.<br> An error will be returned when the package documents (labels) are already prepared (invoked by a previous call) and are now be be printed with a different workstationId containing an incompatible printer. </p> <p> length=50 </p>
        documentOutputScope:
          $ref: '#/components/schemas/DLDocumentScopeDTO'
        documentOutputMode:
          $ref: '#/components/schemas/DLDocumentOutputModeDTO'
        doCompletion:
          type: boolean
          description: <p> 'true' or '1' = The shipment is set in status "Complete". In this status the shipment is sealed, it cannot be changed, no packages can be added anymore. The shipment is automatically assigned to a pickup or can be manually assigned, depending on the customizing.<br> It is required, that the documents for each package are prepared. When they are not prepared yet, the field <code>documentPrepareScope</code> must be set accordingly, otherwise an error is returned.<br> Not printed documents (labels) can be printed after completion with the <code>processShipment</code> call. </p> <p> 'false' or '0' = The shipment is left open, further packages can be added with the <code>processShipment</code> call. If the shipment has already been completed, nothing is done. </p>
      description: Process parameters for a shipment. Specifies which operations have to be performed after a shipment has been created.
