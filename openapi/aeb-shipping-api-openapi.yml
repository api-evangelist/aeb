          type: string
          description: '<p> Controls the creation of the shipment and/or it''s packages as a transaction in the carrier engine. This is necessary for further processing like label printing or EDI generation. Valid values are: <li>VALIDATION_OK The shipment/packages is/are only created, when the shipment could be validated. Otherwise validation warnings will be returned in the response. <li>ALWAYS The shipment/packages is/are created even if validation fails and validation warnings are returned. Those warnings can either be corrected manually using the GUI or the shipment has to be cancelled via a <code>cancelShipment</code> call and retransmitted with a <code>createShipment</code> call. The cancel step is necessary because a direct retransmission of existing shipments and packages is not allowed. </p> Mandatory field.<br> <p> length=15 </p>'
      description: Creation parameters for a shipment. Specifies when and how to create a shipment or it's packages.
    DLAttachmentDTO:
      type: object
      properties:
        filename:
          type: string
          description: File name including a file extension <p>lenght = 250 </p>.
        mimeType:
          type: string
          description: 'The MIME type of the document. Possible values: <ol> <li>"application/pdf" document is in PDF format <li>"printer/raw" document is in printer language (e.g. ZPL or EPL) and can be directly sent to a printer <li>"image/<code>format</code>" document is a printable image. <code>format</code> can be "png", "jpeg", etc. </ol> <p> length = 30 </p>'
        data:
          type: string
          description: Attachment data/content.
          format: byte
        contentType:
          type: string
          description: 'Attachment type.<br> Indicates the business content of the document towards the carrier. If empty, the carrier''s default is used. <p> Possible values: <ul> <li> COMMERCIAL_INVOICE</li> <li> PRO_FORMA_INVOICE</li> <li> CERTIFICATE_OF_ORIGIN</li> <li> NAFTA_CERTIFICATE_OF_ORIGIN</li> <li> EXPORT_ACCOMPANYING_DOCUMENT</li><li> PACKING_LIST</li><li> WEIGHT_DECLARATION</li><li> SHIPPERS_DECLARATION</li><li> DELIVERY_NOTE</li><li> MOVEMENT_CERTIFICATE_ATR</li><li> MOVEMENT_CERTIFICATE_EUR1</li><li> LETTER_OF_CREDIT</li><li> CERTIFICATE_OF_COMPLIANCE</li><li> CERTIFICATE_OF_MANUFACTURER</li><li> CERTIFICATE_OF_WARRANTY</li><li> CERTIFICATE_OF_WEIGHTANDQUANTITY</li><li> NONWOOD_PACKING_DECLARATION</li><li> OTHER</li> </ul> </p> <p> length=30 </p>'
      description: DTO to hold attachment data.
    DLValidateShipmentRequestDTO:
