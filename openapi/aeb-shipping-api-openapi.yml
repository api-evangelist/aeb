          description: '<p> The type of the reference number or text. Valid values are: <li>INVOICE_NUMBER - Invoice number. <li>CUSTOMS_REGISTRATION_NUMBER - Customs registration number. <li>RECEIVER_EORI_NUMBER - Receiver EORI number. <li>IMPORTER_EORI_NUMBER - Importer EORI number. <li>CUSTOMS_AGENT_EORI_NUMBER - Customs agent EORI number.<li>RECEIVER_VAT_NUMBER - Receiver VAT number. <li>IMPORTER_VAT_NUMBER - Importer VAT number. <li>CUSTOMS_AGENT_VAT_NUMBER - Customs agent VAT number. <li>SHIPPER_IOSS_NUMBER - Shipper IOSS (Import OneStopShop) registration number. <li>SHIPPER_VOEC_NUMBER - Shipper VOEC (Norwegian VAT on eCommerce) registration number. <li>SHIPPER_PVA_NUMBER - Shipper PVA (British Postponed VAT Accounting) registration number. <li>CUSTOMS_AGENT_UKIMS_NUMBER - Customs agent UKIMS number. <li>RECEIVER_UKIMS_NUMBER - Receiver UKIMS number. <li>IMPORTER_UKIMS_NUMBER - Importer UKIMS number. <li>CUSTOMS_AGENT_DUTY_DEFERMENT_NUMBER - Customs agent duty deferment number. <li>RECEIVER_DUTY_DEFERMENT_NUMBER - Receiver duty deferment number. <li>IMPORTER_DUTY_DEFERMENT_NUMBER - Importer duty deferment number. <li>SENT_NUMBER - SENT number. <li>UIT_NUMBER - UIT number. <li>EKAER_NUMBER - EKAER number. <li>ACID_NUMBER - Advance Cargo Information Approval Number used to identify a pre-arrival cargo information filing within customs or governmental clearance processes. </P> <p> length=15 </p>'
        value:
