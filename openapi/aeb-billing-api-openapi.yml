  /BillingBFBean/offsetServiceItems:
    post:
      tags:
      - Billing
      summary: offsetServiceItems
      description: Offset the service items in the Billing engine.<br> Offsetting a service item will offset all relevant settlement items of this service item, by creating exact copies of the relevant settlement items with reversed sign.<br> Depending on customizing, some settlement items will not take part in offsetting the service item and some settlement items will prevent any offsetting at all, which leads to an error.<br> The processing of all items will be done in one transaction, so in case of any error, nothing will be persisted. Therefore check the errorFlag and error message arrays in the response for any error to detect this case.<br>
      operationId: offsetServiceItems
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BReverseServiceItemsRequestDTO'
          application/xml:
            schema:
              $ref: '#/components/schemas/BReverseServiceItemsRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BReverseServiceItemsResponseDTO'
            application/xml:
              schema:
                $ref: '#/components/schemas/BReverseServiceItemsResponseDTO'
      security:
      - BASIC_AUTH: []
  /BillingBFBean/setServiceMasterFileData:
    post:
      tags:
      - Billing
      summary: setServiceMasterFileData
      description: Create or update multiple Services in the Billing engine.<br> Create or update multiple services in the master file data of the engine. Because of performance and transactional issues it is recommended to transfer about 100 services within one synchronous call. All transfered services will be either created or updated. The identCode and scenarioIdentCode (these are key values) of the service will be checked before processing. In case of any unfilled key value, nothing will be done. In case of other problems for a single service e.g locking or invalid identCode values the processing is usually continued with the next service, skipping, the problematic service. This means the record will be skipped completely and processing will continue with the next service. Anyway such errors will set the hasErrors or hasWarnings to true. To analyse situations check the response for details. Possible messageIdentCodes are documented in AbstractResponseDTO, BSetServiceMasterFileDataResponseDTO, BServiceMFResultDTO, AbstractResponseItemDTO and BServiceMFResultDTO
      operationId: setServiceMasterFileData
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BSetServiceMasterFileDataRequestDTO'
          application/xml:
            schema:
              $ref: '#/components/schemas/BSetServiceMasterFileDataRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BSetServiceMasterFileDataResponseDTO'
            application/xml:
              schema:
                $ref: '#/components/schemas/BSetServiceMasterFileDataResponseDTO'
      security:
      - BASIC_AUTH: []
  /BillingBFBean/simulateCreateServiceItems:
    post:
      tags:
      - Billing
      summary: simulateCreateServiceItems
      description: This method does the same as createServiceItems, but does not store the results in the database.<br> So this method can e.g. be used to precalculate prices for potential service items or just for testing purposes.
      operationId: simulateCreateServiceItems
      requestBody:
        content:
