openapi: 3.2.0
info:
  title: Logistics Cost Management HTTP Billing API
  description: Thank you for using our HTTP API documentation.
  version: '2.0'
servers:
- url: https://rz3.aeb.de/demo1billing/rest
security:
- SWAGGER_AUTH_KEY: []
- BASIC_AUTH: []
tags:
- name: Billing
  description: API for the billing of services
paths:
  /BillingBFBean/acknowledgeChangedSettlements:
    post:
      tags:
      - Billing
      summary: acknowledgeChangedSettlements
      description: Acknowledge that changed settlements were processed and should no longer be returned by getChangedSettlements.
      operationId: acknowledgeChangedSettlements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BAcknowledgeChangedSettlementsRequestDTO'
          application/xml:
            schema:
              $ref: '#/components/schemas/BAcknowledgeChangedSettlementsRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BAcknowledgeChangedSettlementsResponseDTO'
            application/xml:
              schema:
                $ref: '#/components/schemas/BAcknowledgeChangedSettlementsResponseDTO'
      security:
      - BASIC_AUTH: []
  /BillingBFBean/cancelServiceItems:
    post:
      tags:
      - Billing
      summary: cancelServiceItems
      description: Cancel the service items in the Billing engine.<br> Cancel a service item will try to logically remove the service item with all of its settelement items, if this is possible.<br> In some cases the cancellation of service items is not (or no longer) possible and will lead to errors.<br> E.g. the service item can not be found, or some of the settlement items of the service item can not or no longer be logically removed.<br> The processing of all items will be done in one transaction, so in case of any error, nothing will be persisted. Therefore check the errorFlag and message arrays in the response for any error to detect this case.<br>
      operationId: cancelServiceItems
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BReverseServiceItemsRequestDTO'
          application/xml:
            schema:
              $ref: '#/components/schemas/BReverseServiceItemsRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BReverseServiceItemsResponseDTO'
            application/xml:
              schema:
                $ref: '#/components/schemas/BReverseServiceItemsResponseDTO'
      security:
      - BASIC_AUTH: []
