  /BillingBFBean/getChangedSettlements:
    post:
      tags:
      - Billing
      summary: getChangedSettlements
      description: <p>Returns all changed settlements.</p> <p> This method should be used together with acknowledgeChangedSettlements. </p> See also BGetChangedSettlementsResponseDTO#syncId
      operationId: getChangedSettlements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BGetChangedSettlementsRequestDTO'
          application/xml:
            schema:
