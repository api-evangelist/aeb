components:
  schemas:
    CarrierInfoTextSetupPage:
      required:
      - content
      type: object
      properties:
        content:
          type: array
          description: List of carrier info text setups.
          items:
            $ref: '#/components/schemas/CarrierInfoTextSetup'
    AdditionalValueSetupAttributes:
      required:
      - businessObject
      - choiceList
      - dataType
      - translations
      type: object
      properties:
        dataType:
          type: string
          description: The data type of the additional value
          enum:
          - BOOLEAN
          - CHOICE
          - CURRENCY
          - DATE
          - DATETIME
          - DECIMAL2
          - DECIMAL3
          - PACKAGE_TYPE
          - STRING
          - TIME
        businessObject:
          type: string
          description: The business object, which the additional value refers to
          enum:
          - HAZITEM
          - ITEM
          - PACKAGE
          - SHIPMENT
        translations:
          type: array
          description: The name of the additional value in multiple languages.
          items:
            $ref: '#/components/schemas/AdditionalValueTextTranslation'
        choiceList:
          type: array
          description: List of choices for the Datatype 'choice'
          items:
            $ref: '#/components/schemas/AdditionalValueChoiceEntry'
      description: Information about the additional value setup.
    ServiceSetup:
      required:
      - identCode
      type: object
      properties:
        identCode:
          maxLength: 20
          minLength: 1
          type: string
          description: The identCode of the MO.
        isEnabled:
          type: boolean
          description: If false, the carrier service is inactive and not available for new shipments.
          example: true
        isDeprecated:
          type: boolean
          description: If true, the carrier service is deprecated an should not be used anymore for new shipments.
          readOnly: true
          example: true
      description: List of service setups.
    AebProblemError:
      type: object
      properties:
        code:
          type: string
          description: Code identifying the type of the error.
          example: INVALID_VALUE
        message:
          type: string
          description: Description of the error.
          example: Item number invalid
        field:
          type: string
          description: JSON pointer to a data field that contains the erroneous value.
          example: items/2/itemNumber
        value:
          type: string
          description: Textual representation of the erroneous value.
          example: 7411A
      description: Array of related errors
    ChoiceEntryTextTranslation:
      required:
      - language
      type: object
      properties:
        language:
          maxLength: 2
          minLength: 2
          pattern: '[A-Z]{2}'
          type: string
          description: 2-letter ISO code of the language.
          example: DE
        name:
          maxLength: 40
          minLength: 0
          type: string
          description: The name of the choice entry
          example: UPS Express
      description: Name of the choice entry in a certain language.
    AdditionalValueSetupPage:
      required:
      - content
      type: object
      properties:
        content:
          type: array
          description: List of additional value setups.
          items:
            $ref: '#/components/schemas/AdditionalValuesSetup'
    CarrierSetupStatus:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          description: 'The status of the carrier setup. Possible values are: <li>COMPLETE <li>INCOMPLETE<br> COMPLETE means that the carrier setup is ready for use. INCOMPLETE means that the carrier setup still has status objectives and therefore is not ready for use.'
          readOnly: true
          enum:
          - COMPLETE
          - INCOMPLETE
      description: The status of a carrier setup.
    AdditionalValueChoiceEntry:
      required:
      - identCode
      - translations
      type: object
      properties:
        identCode:
          maxLength: 100
          minLength: 1
          type: string
          description: The identCode of the choice entry.
        ediCode:
          maxLength: 100
          minLength: 0
          type: string
          description: The ediCode of the choice entry
        translations:
          type: array
          description: The name of the choice entry in multiple languages.
          items:
            $ref: '#/components/schemas/ChoiceEntryTextTranslation'
      description: Additional information about the choice entry of an additional value.
    ValueAddedServicePage:
      required:
      - content
      type: object
      properties:
        content:
          type: array
          description: List of value added service setups.
          items:
            $ref: '#/components/schemas/ValueAddedService'
    CarrierSetupPage:
      required:
      - content
      - totalElements
      type: object
      properties:
        totalElements:
          type: integer
          description: The total number of elements available to return.
          readOnly: true
          example: 100
        content:
          type: array
          description: List of carrier setups.
          items:
            $ref: '#/components/schemas/CarrierSetup'
    ServiceSetupPage:
      required:
      - content
      type: object
      properties:
        content:
          type: array
          description: List of service setups.
          items:
            $ref: '#/components/schemas/ServiceSetup'
    AdditionalValuesSetup:
      required:
      - identCode
      - type
      type: object
      properties:
        identCode:
          maxLength: 20
          minLength: 1
          type: string
          description: The identCode of the MO.
        type:
          type: string
          description: The type of the additional value
          enum:
          - DEFINITION_BASED
          - SETUP_SPECIFIC
        attributes:
          $ref: '#/components/schemas/AdditionalValueSetupAttributes'
      description: Information about an additional value setup.
    AebProblem:
      type: object
      properties:
        type:
          type: string
          description: 'A URI reference that uniquely identifies the problem type in the

            context of the provided API. Opposed to the specification in RFC-7807,

            it neither points to a human-readable documentation nor globally

            unique for the problem type.'
          format: uri
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          format: int32
          example: 404
        title:
          type: string
          description: Title
          example: Not found
        detail:
          type: string
          description: Detail info
          example: Item not found
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
          format: uri
          example: item/12345
        timestamp:
          type: string
          description: Timestamp of the error
          format: date-time
          example: '2024-03-28T12:45:31.7857371Z'
        xRequestId:
          type: string
          description: ID of the request that is associated with the problem.
        errors:
          type: array
          description: Array of related errors
          items:
            $ref: '#/components/schemas/AebProblemError'
    CarrierSetup:
      required:
      - identCode
      - name
      - type
      type: object
      properties:
        identCode:
          maxLength: 20
          minLength: 1
          type: string
          description: The identCode of the MO.
        isEnabled:
          type: boolean
          description: If false, the carrier setup is logically deleted. <br> Disabling a carrier setup means that it cannot be linked to new shipments any more. <br>Disabled carrier setups are considered in both PUT and DELETE /carrier-setups API methods.
          example: false
        name:
          maxLength: 50
          minLength: 0
          type: string
          description: The name of the carrier setup
          readOnly: true
          example: DHL Paket international
        type:
          type: string
          description: The type of the carrier setup
          readOnly: true
          example: STANDARD
          enum:
          - STANDARD
          - PROJECT
          - CLIENT
      description: The most important information of the carrier setup.
    ValueAddedService:
      required:
      - identCode
      type: object
      properties:
        identCode:
          maxLength: 20
          minLength: 1
          type: string
          description: The identCode of the MO.
        isEnabled:
          type: boolean
          description: If false, the value added service is inactive and not available for new shipments.
          example: true
        isDeprecated:
          type: boolean
          description: If true, the value added service is deprecated an should not be used anymore for new shipments.
          readOnly: true
          example: true
      description: Information about the value added service setup.
    CarrierInfoTextSetup:
      required:
      - identCode
      type: object
      properties:
        identCode:
          maxLength: 20
          minLength: 1
          type: string
          description: The identCode of the MO.
        isEnabled:
          type: boolean
          description: If false, the carrier info text is inactive and not available for new shipments.
          example: true
        isDeprecated:
          type: boolean
          description: If true, the carrier info text is deprecated an should not be used anymore for new shipments.
          readOnly: true
          example: true
      description: List of carrier info text setups.
    AdditionalValueTextTranslation:
      required:
      - language
      type: object
      properties:
        language:
          maxLength: 2
          minLength: 2
          pattern: '[A-Z]{2}'
          type: string
          description: 2-letter ISO code of the language.
          example: DE
        name:
          maxLength: 50
          minLength: 0
          type: string
          description: The name of the additional value.
          example: UPS Express
      description: Name of the additional value in a certain language.
  securitySchemes:
    SWAGGER_AUTH_KEY:
      type: apiKey
      name: X-XNSG_WEB_TOKEN
      in: header
    BASIC_AUTH:
      type: http
      scheme: basic
x-proxy-enabled: false
