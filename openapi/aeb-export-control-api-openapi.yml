          default: false
        totalResultType:
          type: string
          description: Represents the accumulated result type of the whole transaction.Possible values are:<ul><li><code>OK</code></li><li><code>INFO</code></li><li><code>CLEARED</code></li><li><code>CHECK</code></li><li><code>REQUIRE</code></li><li><code>CUSTOM_RESTRICTION</code></li><li><code>RESTRICTION</code></li><li><code>ERROR</code></li></ul>The result type will be <code>null</code>, if <code>isDeleted<code> is set to <code>true</code>
          example: OK
        itemResults:
          type: array
          description: The result of the every item of the transaction.
          items:
            $ref: '#/components/schemas/ECItemCheckResultV2DTO'
      description: The export control result for a whole transaction. Note that this DTO is inspired by *ECTotalCheckResultDTO* and *CheckTransactionResponseDTO*. There is no explicit previous version called *ECTransactionCheckResultDTO*.
