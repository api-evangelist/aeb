          items:
            $ref: '#/components/schemas/ResponseMessageDTO'
        status:
          type: string
          description: 'The functional status of the response. It is only filled, if the response indicates a valid request from a functional point of view. Otherwise (, e.g., if there are errors) it is left empty.<br>Possible values are:<ul><li><code>TRANSACTION_NOT_FOUND</code>: Indicates that the check transaction of the specified transaction ID is not found. This might happen, if the previous EC checks for the checked transaction from host system did not result in a restriction (, i.e., no necessity to release an item). In those cases no check transaction was created. It is suggested to do another EC check (via <code>/ExportControl/v2/checkTransaction</code>) to get the current check result. Another reason for a check transaction not being found could be that it has been deleted in Trade Compliance Management.<br>If this status is returned, the <code>checkResult</code> should not be evaluated, as it will be undefined.</li><li><code>TRANSACTION_FOUND</code>: Indicates that the check transaction of the specified transaction ID exists.</li></ul>'
        checkResult:
          $ref: '#/components/schemas/ECTransactionCheckResultV2DTO'
      description: Response when getting the check result of a certain EC check transaction.
