          maxLength: 20
          type: string
          description: The type of license applied. Contains the identifier of the License Management license type of the license applied. The LM license type is only available for licenses from License Management.
          example: EAG
        uniqueApprovalId:
          type: string
          description: A unique id for this approval.
          example: '12021'
      description: DTO representing an approval used in the current item to release a restriction or a required license.
    ECItemCheckResultDTO:
      type: object
      properties:
        itemIdHost:
          type: string
          description: The itemIdHost of the item as passed with <code>ECItemDTO</code>.
          example: item-1
        bomItemResults:
          type: array
          description: The results for BOM items belonging to this item.<br>The results of these BOM items will <em>not</em> be accumulated into this item result.
          items:
            $ref: '#/components/schemas/ECItemCheckResultDTO'
        resultType:
          type: string
          description: Represents the accumulated result type of the whole item.<br>Possible values are:<ul><li><code>OK</code></li><li><code>INFO</code></li><li><code>CLEARED</code></li><li><code>CHECK</code></li><li><code>REQUIRE</code></li><li><code>CUSTOM_RESTRICTION</code></li><li><code>RESTRICTION</code></li><li><code>ERROR</code></li></ul>
          example: OK
        pluginResults:
          type: array
          description: Contains one result for each used jurisdiction.
          items:
            $ref: '#/components/schemas/ECPluginCheckResultDTO'
      description: The export control result for one item of the transaction.
    CheckTransactionRAParmsDTO:
      type: object
      properties:
        templateId:
          type: string
          description: "Unique technical ID number of the questionnaire template. This field is mandatory, if\t<code>isRiskAssessmentRequested</code> is <code>true</code>.<br>\t<br>\tTemplate ID, client, partner system ID and transaction ID are used to find the appropriate\tquestionnaire for the export control check. If the questionnaire for the reference data\tdoes not exist yet, then it will be created. If the questionnaire exists, then it will\tbe checked, if the questionnaire still suits to the data in the export control\ttransaction (only partner data is considered)."
          example: '0001'
        isRiskAssessmentRequested:
          type: boolean
          description: Indicates that Risk Assessment rules should be evaluated in an export control check.<br><br>If set and enabled in the profile, questionnaires for Risk Assessment are evaluated as part of the export control check. This involves possibly the creation of a questionnaire and may cause restrictions in the Risk Assessment jurisdiction, depending on status and outcome of the questionnaire.
          example: true
          default: false
        isDataForRAComplete:
          type: boolean
          description: Indicates that Risk Assessment should be considered in the export control check, but not allrelevant data is available yet.<br><br>If this flag is set to <code>false</code>, no questionnaire will be created. This will cause a restriction in the Risk Assessment jurisdiction if Risk Assessment functionality is requested (due to <code>isRiskAssessmentRequested</code> and due to configuration in the profile the Risk Assessment integration is relevant for the transaction.<br>
          example: true
          default: true
        questionnaireData:
          $ref: '#/components/schemas/CreateRAQuestionnaireDataDTO'
      description: Parameters to integrate Risk Assessment in an export control check.
    DeleteTransactionResponseDTO:
      type: object
      properties:
        hasErrors:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>An error usually means that the request could not be performed.</p><p>Error details are provided in the messages[] array.</p>
          example: false
        hasOnlyRetryableErrors:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>Error details are provided in the messages[] array.</p>
          example: true
        hasWarnings:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>Error details are provided in the messages[] array.</p>
          example: true
        messages:
          type: array
          description: <p>Error or warning messages at the request level.</p><p>There may be additional messages[] arrays at lower data levels as specified in the documentation.</p>
          items:
            $ref: '#/components/schemas/ResponseMessageDTO'
      description: Response of <code>/ExportControl/v2/deleteTransaction</code>.
    GetTransactionCheckResultRequestDTO:
      required:
      - transactionIdHost
      type: object
      properties:
        clientSystemId:
          type: string
          description: '<p>Id of the sending client system.</p><p>e.g. Installation ID of the sending host or ERP system.</p><p>Maximum length: 20</p>'
          example: TEST_ID
        clientIdentCode:
          type: string
          description: '<p>Client identification code.</p><p>Maximum length: 10</p>'
          example: APITEST
        userName:
          type: string
          description: <p>User who initiated the request from the client system.</p><p>If the user is found either in the system's user management or in a connected LDAP directory, the request runs under this user's roles.</p><p>If the user is not found, the request is only granted the basic 'I_EVERYONE' role. The user name may be used for logging purposes in this case.</p><p>Actual authentication is handled separately via the request's headers, so no password is required in the request's data.</p>
          example: API_TEST
        resultLanguageIsoCodes:
          type: array
          description: <p>2-letter ISO codes of the languages in which texts will be returned.</p><p>English ('en') and German ('de') are typically supported by default. Other languages may be supported.</p><p>Translations will be looked up in the order of the provided language codes. If a translation is not available in one language, the next language is used instead.</p>
          example:
          - en
          - de
          items:
            type: string
            description: <p>2-letter ISO codes of the languages in which texts will be returned.</p><p>English ('en') and German ('de') are typically supported by default. Other languages may be supported.</p><p>Translations will be looked up in the order of the provided language codes. If a translation is not available in one language, the next language is used instead.</p>
            example: '["en","de"]'
        transactionIdHost:
          type: string
          description: The unique ID of the transaction to get the result for.
          example: MANDANT=001/BELNO=80004989
      description: Request to get the check result of a certain EC check transaction.
    ECTransactionDTO:
      required:
      - items
      - transactionIdHost
      type: object
      properties:
        transactionIdHost:
          type: string
          description: A unique id for the transaction.
          example: MANDANT=001/BELNO=80004989
        transactionLabelHost:
          type: string
          description: A human-readable form of the unique id for the transaction.
          example: Mandant = 001; Auftragsnr. = 80004989
        partners:
          type: array
          description: The partners involved in this transaction. All partners defined with a particular role here will be applied to all items of this transaction that do not have partners with that role defined on their own.<br>If there is at least one partner defined in the array, all other partners that can be defined with the deprecated partners fields in <code>ECItemDTO</code>  (like e.g. <code>recipient</code>), etc. will be ignored.<br>More information about partners is found on item level; see <code>ECItemDTO.partners</code>.
          items:
            $ref: '#/components/schemas/ECPartnerDTO'
        items:
          type: array
          description: The items of the transaction. Only fill normal transaction items into this array. BOM sub items should be filled into <code>bomItems</code>.
          items:
            $ref: '#/components/schemas/ECItemDTO'
        transactionType:
          type: string
          description: The ident code of the transaction type. The transaction type will implicitly (through configuration in Trade Compliance Management) determine the behavior of decrementing quantities or values from the license.<br> The field defaults to a standard transaction type for outbound transactions.
          example: OUTBOUND_STD
        customData:
          $ref: '#/components/schemas/GenericDataRecordDTO'
      description: Data about the transaction.
    ErrorData:
      type: object
      properties:
        errorMessage:
          type: string
        errorCause:
          type: string
    CheckTransactionResponseDTO:
      type: object
      properties:
        hasErrors:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>An error usually means that the request could not be performed.</p><p>Error details are provided in the messages[] array.</p>
          example: false
        hasOnlyRetryableErrors:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>Error details are provided in the messages[] array.</p>
          example: true
        hasWarnings:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>Error details are provided in the messages[] array.</p>
          example: true
        messages:
          type: array
          description: <p>Error or warning messages at the request level.</p><p>There may be additional messages[] arrays at lower data levels as specified in the documentation.</p>
          items:
            $ref: '#/components/schemas/ResponseMessageDTO'
        totalResultType:
          type: string
          description: Represents the accumulated result type of the whole transaction. It is filled whenever there are no errors that prevent a check of the transaction.Possible values are:<ul><li><code>OK</code></li><li><code>INFO</code></li><li><code>CLEARED</code></li><li><code>CHECK</code></li><li><code>REQUIRE</code></li><li><code>CUSTOM_RESTRICTION</code></li><li><code>RESTRICTION</code></li><li><code>ERROR</code></li></ul>
          example: OK
        itemResults:
          type: array
          description: The results of every item of the transaction. It is filled if at least one item was checked.
          items:
            $ref: '#/components/schemas/ECItemCheckResultDTO'
      description: Represents a response of checking a transaction in Export Controls.
    FinalizeApprovalResponseDTO:
      type: object
      properties:
        hasErrors:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>An error usually means that the request could not be performed.</p><p>Error details are provided in the messages[] array.</p>
          example: false
        hasOnlyRetryableErrors:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>Error details are provided in the messages[] array.</p>
          example: true
        hasWarnings:
          type: boolean
          description: <p>True, if there are any error messages.</p><p>Error details are provided in the messages[] array.</p>
          example: true
        messages:
          type: array
          description: <p>Error or warning messages at the request level.</p><p>There may be additional messages[] arrays at lower data levels as specified in the documentation.</p>
          items:
            $ref: '#/components/schemas/ResponseMessageDTO'
      description: Response of <code>/ExportControl/v2/finalizeApproval</code>.
    GenericDataRecordDTO:
      type: object
      properties:
        fields:
          type: array
          description: The fields of the record.
          items:
            $ref: '#/components/schemas/GenericDataFieldDTO'
        subrecords:
          type: array
          description: Subrecords of the record.
          example:
          - name: child
            record:
              fields: []
              subrecords: []
          items:
            $ref: '#/components/schemas/NamedGenericDataRecordDTO'
      description: A generic record of data.<br>Each field is qualified by name and type and has a value.
    ECItemCheckResultV2DTO:
      type: object
      properties:
        itemIdHost:
          type: string
          description: Unique id for the item within the transaction.
        resultType:
          type: string
          description: Represents the accumulated result type of the whole item.<br>Possible values are:<ul><li><code>OK</code></li><li><code>INFO</code></li><li><code>CLEARED</code></li><li><code>CHECK</code></li><li><code>REQUIRE</code></li><li><code>CUSTOM_RESTRICTION</code></li><li><code>RESTRICTION</code></li><li><code>ERROR</code></li></ul>
          example: OK
        pluginResults:
          type: array
          description: The result of every checked jurisdiction of the item.
          items:
            $ref: '#/components/schemas/ECPluginCheckResultV2DTO'
        bomItemResults:
          type: array
          description: The results for BOM items belonging to this item.<br>The results of these BOM items will *not* be accumulated into this item result.
          items:
            $ref: '#/components/schemas/ECItemCheckResultV2DTO'
      description: The export control result for one item of the transaction.
    ECLicenseReferenceDTO:
      type: object
      properties:
        licenseId:
          type: string
          description: The license id of the used license. The field is filled, depending on the origin of the license:<br>In case of<ul><li>a license from License Management, the internal id of the license is passed, e.g. <code>00000000000000231543</code>.</li><li>a license from Export Controls, the license number of the license with leading prefix "EC_" is passed, e.g. <code>EC_EU001</code>, <code>EC_AGG09</code>.</li><li>no license is required, <code>NLR</code> is passed.</li><li>referencing a license that does not exist in Trade Compliance Management, the field is empty (<code>null</code>).</li></ul>
          example: '00000000000000231543'
        licenseItemId:
          type: string
          description: The id of the license item from a license that has items. For licenses without items, this will be empty.
          example: '1'
      description: DTO used for referencing a real license and license item.
    ECItemDTO:
      required:
      - decisiveDate
      - itemIdHost
      type: object
      properties:
        itemIdHost:
          type: string
          description: Unique id for the item within the transaction.
          example: '4711'
        itemLabelHost:
          type: string
          description: Human-readable label for the item.
          example: Positionsnr. = 4711
        mainApprovalItemTransIdHost:
          maxLength: 255
          type: string
          description: Unique id of the transaction which includes the item that contains the main approvals. Has to be specified along with the <code>mainApprovalItemIdHost</code>.
        mainApprovalItemIdHost:
          maxLength: 255
          type: string
          description: Unique id of the transaction item that contains the main approvals within the transaction of the specified mainApprovalItemTransIdHost (has to be specified along with it).<br><br>The item of the main approvals is especially used for automatic creation of partial approvals. If such an item is specified and there is not yet an approval for a certain jurisdiction, the approval will be created as partial approval based on the main approval of the appropriate jurisdiction.<br><br>If the parent item does not exist, an error occurs.<br><br>Used by <code>/checkTransaction</code> to replace the necessity to specify the main approvals directly using <code>uniqueParentClearingIds</code>.
        bomItems:
          type: array
          description: The BOM (=bill of materials) sub items belonging to this item.<br/>Note that only two-level item hierarchies are allowed, i.e. the bomItems may only contain items that have no bomItems themselves
          example:
          - itemIdHost: '4711_1'
            itemLabelHost: Positionsnr. = 4711-1
          items:
            $ref: '#/components/schemas/ECItemDTO'
        partners:
          type: array
          description: 'Partners involved in this transaction item.<br>This array may be used to define partners of the predefined standard roles or partners with other, configured roles.<br>If there is at least one partner defined in the array, all other partners that can be defined with the deprecated partners fields in this DTO (like *recipient*, etc. will be ignored<br>Partners of a certain role defined here will replace partners with the same role defined on transaction level. To minimize network traffic, fill the partners on item level only if they differ from the partners on transaction level.<br>

            This field will be ignored for BOM items.<br>The partners of following partner roles are mandatory:<ul><li><code>CONSIGNOR_STD</code></li><li><code>SELLER_STD</code></li><li><code>CONSIGNEE_STD</code></li></ul>For mandatory partners at least the *ECPartnerDTO.countryIso* must be filled.'
          items:
            $ref: '#/components/schemas/ECPartnerDTO'
        ctryProductOrigin:
          maxLength: 2
          type: string
          description: Two-letter ISO code of the country of origin of the goods.
          example: DE
        decisiveDate:
          type: string
          description: The decisive date of the transaction. This date will be used to determine country groups and currency rates (which may be both date dependent).
          format: date
          example: '2015-01-01'
        productClassifications:
          type: array
          description: The attributes of the transaction item, e.g. export control numbers, material number, commodity code and other relevant numbers for export control checks and license matching.
          items:
            $ref: '#/components/schemas/ECClassificationDTO'
        productDataCompletionStatus:
          type: array
          description: Only relevant when using version 1 for the handling of goods attributes. The completion status indicates whether the product data for DE/EU plug-in and US-EAR plug-in is complete.<br>Is not supported by <code>/ExportControl/v2/checkTransaction</code>.<br><br>When using version 2 for the handling of goods attributes, the completion status can be specified directly via the goods attribute. For not-maintained goods attributes, no classification should be transmitted. To indicate that an item has been classified but is not listed, <code>NOT_LISTED</code> should be transmitted.
          items:
            $ref: '#/components/schemas/ECCompletionStatusDTO'
        identitiesOfGoods:
          type: array
          description: The identities of goods for this transaction item, e.g. serial numbers, lot numbers, etc.<br>To ensure to use the same license for the same physical goods between different transactions (inbound, outbound, etc.), these identities may be  used for license matching in addition to the product classifications.
          items:
            $ref: '#/components/schemas/ECIdentityOfGoodsDTO'
        descriptionOfGoods1:
          maxLength: 40
          type: string
          description: 'First line of description of commodity.

            Maximum length: 40'
          example: Description 1
        descriptionOfGoods2:
          maxLength: 40
          type: string
          description: 'Second line of description of commodity.

            Maximum length: 40'
          example: Description 2
        descriptionOfGoods3:
          maxLength: 40
          type: string
          description: 'Third line of description of commodity.

            Maximum length: 40'
          example: Description 3
        descriptionOfGoods4:
          maxLength: 40
          type: string
          description: 'Fourth line of description of commodity.

            Maximum length: 40'
          example: Description 4
        finalUsages:
          type: string
          description: Indicates the end-uses of the goods. Use <code>FINAL_USAGE_NONE</code> or <code>FINAL_USAGE_ALL</code> to indicates that there is no special end-use or all end-uses are possible. Other special end-uses depend on the plug-ins installed and may be separated by ';' if more than one applies.<br>Possible values are:<ul><li><code>FINAL_USAGE_NONE</code></li><li><code>FINAL_USAGE_ALL</code></li><li><code>DE-EU-ABC-Nuclear-Weapons</code></li><li><code>DE-EU-Nuclearplants</code></li><li><code>DE-EU-Conventional-Weapons</code></li><li><code>DE-EU-IllegalExportedWeapons</code></li><li><code>DE-EU-Military-Consignee</code></li><li><code>DE-EU-Free-Trade-Zone</code></li><li><code>DE-EU-CyberSurveillance-HumanRights</code></li></ul>This field will be ignored for BOM items.
          example: FINAL_USAGE_NONE
          default: FINAL_USAGE_NONE
        valueOfGoods:
          type: array
          description: The value of the goods, denoted in different currencies. This is either the invoice price or (if no invoice price is known) the statistical value. When checking for the jurisdiction EU, at least the value in EUR should occur in the array, so value limits of general licenses ("Wertfreigrenzen") can be considered. When checking for the jurisdiction US, at least the value in USD should occur in the array, so value limits of license exceptions can be considered.
          items:
            $ref: '#/components/schemas/ECAmountDTO'
        orderNumber:
          maxLength: 20
          type: string
          description: Number of the order (contract) or internal file reference that links to the product/check item.<br>This field is optional.
          example: order-121
        quantity:
          maxLength: 15
          type: number
          description: 'The quantity in which the product is exported.<br><br>Decimal digits: <code>3</code>'
          format: double
          example: 12.0
        quantityUnit:
          maxLength: 10
          type: string
          description: The unit of the quantity. Units must be maintained in the master data of Trade Compliance Management. The unit must contain the ident code of the entry in the master data table. This field is usually optional but becomes mandatory if a quantity is given.
          example: ST
        jurisdictionFilter:
          $ref: '#/components/schemas/ECJurisdictionFilterDTO'
        customData:
          $ref: '#/components/schemas/GenericDataRecordDTO'
      description: One item of a transaction to be checked for export control restrictions.
    ECIdentityOfGoodsDTO:
      type: object
      properties:
        typeOfIdentity:
          type: string
          description: The type of the identity of goods, e.g. serial number, lot number, etc.<br> Each specified type must be maintained in the master data of Trade Compliance Management.
          example: SERIAL_NUMBER
        value:
          type: string
          description: The value of the identity of goods.
          example: A12
      description: Specifies the identity of goods.
    ECJurisdictionFilterDTO:
      required:
      - filterMode
      type: object
      properties:
        filterMode:
          type: string
          description: The filter mode to apply. Possible values:<ul><li><code>LIMITING</code></li><li><code>EXCLUDING</code></li></ul>
          example: LIMITING
        jurisdictions:
          type: array
          description: The jurisdictions to filter for depending on the specified <code>filterMode</code>. Specify at least one jurisdiction to have a valid filter. Additionally, it should not contain jurisdictions that are unknown in Export Controls.<br><br>You may use <code>/ComplianceFoundation/getMasterdataIdentifiers</code> to get the possible jurisdictions.
          example:
          - DE-EU-Plugin
          items:
            type: string
            description: The jurisdictions to filter for depending on the specified <code>filterMode</code>. Specify at least one jurisdiction to have a valid filter. Additionally, it should not contain jurisdictions that are unknown in Export Controls.<br><br>You may use <code>/ComplianceFoundation/getMasterdataIdentifiers</code> to get the possible jurisdictions.
            example: '["DE-EU-Plugin"]'
      description: 'Allows to filter (, i.e., restrict) the jurisdictions to consider in export control checks. This is possible in the following ways:<ul><li>Limiting filter mode (value <code>LIMITING</code>): only the intersection of the enabled jurisdictions (according to the used profile) and the specified jurisdictions is checked, i.e., an enabled jurisdiction is only checked if it is part of the specified jurisdictions of  this filter.</li><li>Excluding filter mode (value <code>EXCLUDING</code>): the specified jurisdictions are not checked although they are enabled (according to the used profile).</li></ul>'
    ECPartnerDTO:
      required:
      - roleIdentCode
      type: object
      properties:
        roleIdentCode:
          type: string
          description: The ident code of the role of the partner in the transaction. There are some predefined identCode's and others may be configured.<br>The following predefined role identCodes are supported:<ul><li><code>CONSIGNOR_STD</code></li><li><code>SELLER_STD</code></li><li><code>BUYER_STD</code></li><li><code>CONSIGNEE_STD</code></li><li><code>ENDUSER_STD</code></li></ul>
          example: SELLER_STD
        name1:
          maxLength: 40
          type: string
          description: Field 1 for full name of the company/person.
          example: Paul
        name2:
          maxLength: 40
          type: string
          description: Field 2 for full name of the company/person.
          example: Eugene
        name3:
          maxLength: 40
          type: string
          description: Field 3 for full name of the company/person.
          example: Carl
        name4:
          maxLength: 40
          type: string
          description: Field 4 for full name of the company/person.
          example: Miller
        street:
          maxLength: 50
          type: string
          description: Address - street and number.
          example: Main street 10
        street2:
          maxLength: 50
          type: string
          description: Address - street 2 and number.
          example: Second level
        district:
          maxLength: 50
          type: string
          description: Address - district.
          example: District of Main
        city:
          maxLength: 50
          type: string
          description: Address - city.
          example: Main City
        postalCode:
          maxLength: 20
          type: string
          description: Address - postal code of the street address (not postal code of P.O. box).
          example: '12100'
        countryIso:
          maxLength: 2
          type: string
          description: Address - country as two-letter ISO code.
          example: DE
        poBox:
          maxLength: 50
          type: string
          description: P.O. box.
          example: '121200'
        postalCodePoBox:
          maxLength: 20
          type: string
          description: Postal code of the P.O. box.
          example: '21010'
        cityPobox:
          maxLength: 50
          type: string
          description: City of the P.O. box.
          example: PO City
        customsNumber:
          maxLength: 7
          type: string
          description: German customs number of the company.
          example: '1234567'
        eoriNumber:
          maxLength: 17
          type: string
          description: The internationally unique identification number of the company assigned by customs. (EORI number - Economic Operators' Registration and Identification).
          example: DE012345678912345
        establishmentNumber:
          maxLength: 4
          type: string
          description: The number of the respective national office of a company. The EORI number and this identification number will replace the existing customs number.
          example: '0000'
        companyReference:
          maxLength: 20
          type: string
          description: Internal company number.
          example: '12'
        isMilitary:
          type: boolean
          description: Indicates that the company is associated with the armed forces of EC member country. Relevant for the reports about utilized general licenses (AG) that are sent to the BAFA about twice per year
          example: false
      description: DTO for a partner (typically a company) related to this export process. A partner can be the seller, the buyer, the receiver the final user, ...
    ECPluginCheckResultV2DTO:
      type: object
      properties:
        jurisdiction:
          type: string
          description: ID of the jurisdiction to which the result belongs.<br>Possible values are:<ul><li><code>DE-EU-Plugin</code></li><li><code>US-EAR-Plugin</code></li><li><code>Custom-Plugin</code></li><li><code>Risk-Assessment-Plugin</code></li></ul>Additionally, further jurisdictions may be configured. The IDs of all available jurisdictions of a client can be queried using <code>/ComplianceFoundation/getMasterdataIdentifiers</code>.
          example: DE-EU-Plugin
        resultType:
          type: string
          description: Represents the accumulated result type of the item in the specified jurisdiction <br>Possible values are:<ul><li><code>OK</code></li><li><code>INFO</code></li><li><code>CLEARED</code></li><li><code>CHECK</code></li><li><code>REQUIRE</code></li><li><code>CUSTOM_RESTRICTION</code></li><li><code>RESTRICTION</code></li><li><code>ERROR</code></li></ul>
          example: OK
        approval:
          $ref: '#/components/schemas/ECApprovalInfoV2DTO'
      description: The export control result of a jurisdiction checked for a transaction item.
    TextInLanguageDTO:
      type: object
      properties:
        languageISOCode:
          type: string
          description: <p>2-letter ISO code of the language.</p><p>length=2</p>
          example: en
        text:
          type: string
          description: The translated text.
          example: Some free-form text
      description: A translated text in one of the specified languages.
    AcknowledgeGetChangedTransactionsRequestDTO:
      type: object
      properties:
        clientSystemId:
          type: string
          description: '<p>Id of the sending client system.</p><p>e.g. Installation ID of the sending host or ERP system.</p><p>Maximum length: 20</p>'
          example: TEST_ID
        clientIdentCode:
          type: string
          description: '<p>Client identification code.</p><p>Maximum length: 10</p>'
          example: APITEST
