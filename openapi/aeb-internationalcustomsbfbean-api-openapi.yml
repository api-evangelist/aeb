      operationId: getDeclarations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ICGetDeclarationsRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICGetDeclarationsResponseDTO'
  /InternationalCustomsBFBean/sendDeclarations:
    post:
      tags:
      - InternationalCustomsBFBean
      summary: Send declarations
      description: Sends declaration messages for the specified declarations to the respective customs systems. If the declarations are not ready for sending, an email notification is sent out, if configured.
      operationId: sendDeclarations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ICSendDeclarationMessageRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICSendDeclarationMessageResponseDTO'
