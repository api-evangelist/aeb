  /InternationalCustomsBFBean/createConsignmentManifest:
    post:
      tags:
      - InternationalCustomsBFBean
      summary: Create a consignment manifest
      description: Creates a consignment manifest. If any fields are empty which are mandatory an error message will be created and the creation stopped. Only if the mandatory fields are filled the consignment manifest will be created and imported.
      operationId: createConsignmentManifest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ICCreateConsignmentManifestRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICCreateConsignmentManifestResponseDTO'
  /InternationalCustomsBFBean/createDelivery:
    post:
      tags:
      - InternationalCustomsBFBean
      summary: Create a delivery
      description: Creates a delivery. If any fields are empty which are mandatory an error message will be created and the creation stopped. Only if the mandatory fields are filled the delivery will be created and imported.
      operationId: createDelivery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ICCreateDeliveryRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICCreateDeliveryResponseDTO'
  /InternationalCustomsBFBean/getBrokerDeclarations:
    post:
      tags:
      - InternationalCustomsBFBean
      summary: Get broker declarations
      description: Returns the broker declarations specified by the list of business object ids or consignmentIdClientSystem in the request. You may also specify the amount of broker declaration data returned by choosing from a set of scenarios.
      operationId: getBrokerDeclarations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ICGetBrokerDeclarationsRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICGetBrokerDeclarationsResponseDTO'
  /InternationalCustomsBFBean/getChangedDeclarations:
    post:
      tags:
      - InternationalCustomsBFBean
      summary: Get changed declarations
      description: 'Returns all changed (modified) declarations, which were not yet acknowledged.<br> Only declarations, for which the client system is subscribed, will be returned.<br> If the caller has processed the returned declarations, he should call {@link #acknowledgeGetChangedDeclarations(ICAcknowledgeGetChangedDeclarationsRequestDTO)} to acknowledge.'
      operationId: getChangedDeclarations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ICGetChangedDeclarationsRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICGetChangedDeclarationsResponseDTO'
  /InternationalCustomsBFBean/getCodes:
    get:
      tags:
      - InternationalCustomsBFBean
      operationId: getCodes_1
      parameters:
      - name: clientIdentCode
        in: query
        description: Client identification code.
        schema:
          type: string
      - name: codeListCode
        in: query
        description: Ident code of the code list, identifies which code list will be returned. To retrieve a possible list of inputs use {@code CODELISTS} as input.
        schema:
          type: string
        example: CODELISTS
      - name: resultLanguageIsoCode
        in: query
        description: '2-letter ISO code of the language in which texts will be returned. '
        schema:
          type: string
        example: en
      - name: customsProcess
        in: query
        description: 'Specific customs process. '
        schema:
          type: string
        example: EXPORT_GB
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICGetCodesResponseDTO'
    post:
      tags:
      - InternationalCustomsBFBean
      summary: Get codes
      description: Returns a list of valid codes and its descriptions for the given request parameters. <br> Use the value "CODELISTS" for request parameter 'codeListCode' to get all possible values for this field.
      operationId: getCodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ICGetCodesRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICGetCodesResponseDTO'
  /InternationalCustomsBFBean/getConsignmentsOfManifest:
    post:
      tags:
      - InternationalCustomsBFBean
      summary: Get consignments of manifest
      description: Retrieves a list of business object ids of all consignments collected in the manifest.
      operationId: getConsignmentsOfManifest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ICGetConsignmentsOfManifestRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICGetConsignmentsOfManifestResponseDTO'
  /InternationalCustomsBFBean/getDeclarationAttachments:
    post:
      tags:
      - InternationalCustomsBFBean
      summary: Get declaration attachments
