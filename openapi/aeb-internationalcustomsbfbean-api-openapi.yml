      operationId: getDeclarationAttachments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ICGetDeclarationAttachmentsRequestDTO'
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ICGetDeclarationAttachmentsResponseDTO'
