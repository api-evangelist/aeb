        customsProcedureType:
          maxLength: 35
          type: string
          description: "Specific types are: <ul> <li>EXPORTPROC - Customs procedure code export</li> <li>EXPORTPROCNAT - Customs national procedure code export</li> <li>EXPORTCPCGRP - Customs procedure code category/group export</li> <li>IMPORTPROC - Customs procedure code import</li> <li>IMPORTPROCNAT - Customs national procedure code import</li> <li>IMPORTCPCGRP - Customs procedure code category/group import</li>\t *  <li>'... for full list see /InternationalCustomsBFBean/getCodes with codeListCode=CUSTOMS_PROCEDURE_TYPE</li> </ul>"
        customsProcedureCode:
          maxLength: 20
          type: string
          description: The code depending on the type above.
      description: DTO to hold data for customs procedure codes
    ICLinkedProcessInfoDTO:
      type: object
      properties:
        processType:
          maxLength: 20
          type: string
          description: 'Specific type of process: <ul> <li>PORT_ANTWERP - C-Point system for port notifications. <li>PORT_ROTTERDAM - Prtbase system for port notifications. <li>''... for full list see /InternationalCustomsBFBean/getCodes with codeListCode=LINKED_PROCESS_TYPE </li>  </ul>'
        authoritySystemId:
          maxLength: 50
          type: string
          description: The id in the customs/port authority's system.
        issueDate:
          $ref: '#/components/schemas/DateAndZoneDTO'
      description: 'DTO to hold data of a customs process that is linked to the main declaration object. '
    ClientSpecificFieldDTO:
      type: object
      properties:
        identCode:
          maxLength: 50
          minLength: 1
          type: string
          description: Ident code of the custom field.
        value:
          maxLength: 100
          minLength: 1
          type: string
          description: <p>Value of the client specific field.</p><p>Supported data types:</p><ul><li>String</li><li>Boolean such as 'true' or 'false'</li><li>Decimal such as '10' or with additional precision '10.245'. The actual length and scale of the value depends on the field configuration, maximum length is 15 and maximum scale is 9. The scale will be set to the configured scale with half up rounding if the scale of the value exceeds the configured scale.</li><li>Date such as '2024-06-24'</li><li>DateTime in UTC such as '2024-06-24T10:15:30Z' or with additional precision up to nanoseconds such as '2024-06-24T10:15:30.999666333Z'</li><li>Time such as '10:15:30' or with additional precision up to nanoseconds such as '10:15:30.999666333'</li></ul><p>If the value cannot be parsed according to the configured data type, the value will be ignored and an error will be logged.</p>
        customsProcess:
          maxLength: 20
          type: string
          description: <p>Specific customs process. <ul><li>'EXPORT_BE' - Export process for Belgium</li> <li>'EXPORT_SE' - Export process for Sweden</li> <li>'EXPORT_NL' - Export process for Netherlands</li> <li>'TRANSIT_NL' - Transit process for Netherlands</li> <li>... for full list see /InternationalCustomsBFBean/getCodes with codeListCode=CUSTOMS_PROCESS_TYPE</li></ul></p>
          example: EXPORT_BE
      description: Represents a client specific declaration field. Client specific fields must be configured for the resulting declaration and are never intended to be used as actual fields which are send to customs. However this can be for example an additional criteria which is necessary for the customs process. The field can be used as a template criterion, used in filters and data extractions.
